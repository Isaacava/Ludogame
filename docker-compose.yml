version: "3.8"

services:
  app:
    build: .
    container_name: codeplay-ludo-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:3001}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      WAHA_URL: http://waha:3000
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-dev-waha-secret}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha
    container_name: codeplay-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - waha-sessions:/app/.sessions
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS

volumes:
  waha-sessions:
