<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodePlay Chess</title>
<meta name="theme-color" content="#06100c">
<meta name="description" content="Play chess with friends in seconds — share a link, no sign-up. Clocks, rematches, live spectators and chat.">
<meta property="og:site_name" content="CodePlay">
<meta property="og:type" content="website">
<meta property="og:title" content="♟️ CodePlay Chess — play with friends">
<meta property="og:description" content="Tap the link and you're at the board. Real clocks, rematches, live spectators. No sign-up.">
<meta property="og:image" content="https://ludogame-tau.vercel.app/og-chess.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/theme.css?v=5"><link rel="stylesheet" href="/appbar.css?v=5"><link rel="stylesheet" href="/chess.css?v=5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="/icons.js?v=5"></script>
<script src="/vendor/chess.min.js?v=1"></script>
<script src="/chess-game.js?v=1"></script>
<script src="/chess-board.js?v=1"></script>
<script src="/audio.js"></script>
<script src="versus-ui.js"></script>
</head>
<body class="chessPage">
<header class="appbar">
  <a class="brandLink" href="/" aria-label="CodePlay home"><span class="logoMark"><svg class="ic" aria-hidden="true"><use href="#i-pawn"/></svg></span></a>
  <div class="brand"><b>Chess</b><span id="roomSub">Getting ready…</span></div>
  <div class="barActions">
    <button class="pillBtn watchChip" id="watchTopBtn" aria-label="Viewers and sharing"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span id="watchCount">0</span></button>
    <button class="roundBtn" id="chatTopBtn" aria-label="Open chat" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span class="dot" id="chatDot"></span></button>
    <button class="roundBtn" id="menuBtn" aria-label="Menu"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
  </div>
</header>

<main class="chessMain">
  <section class="waitCard" id="waiting">
    <div class="spin" id="waitSpin"></div>
    <p id="waitText">Connecting…</p>
    <div class="roomCode" id="roomCode" style="display:none"></div>
    <div class="tcChip" id="tcChip" style="display:none"></div>
    <button class="btn wa" id="inviteBtn" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-whatsapp"/></svg> Invite on WhatsApp</button>
    <button class="btn" id="copyInviteBtn" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg> Copy invite link</button>
    <button class="btn" id="waitHome" style="display:none"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg> Home</button>
  </section>

  <section id="game" aria-label="Chess game">
    <div class="pbar" id="barTop"><div class="av b" id="avTop">B</div><div class="pi"><span class="pname" id="nameTop">Black</span><div class="pcap" id="capTop"></div></div><div class="clock" id="clockTop">5:00</div></div>
    <div class="boardWrap"><div id="board"></div><div id="promoHost"></div></div>
    <div class="pbar" id="barBottom"><div class="av w" id="avBottom">W</div><div class="pi"><span class="pname" id="nameBottom">White</span><div class="pcap" id="capBottom"></div></div><div class="clock" id="clockBottom">5:00</div></div>
    <div class="drawBanner" id="drawBanner"><span>Your opponent offers a draw</span><button id="drawNo">Decline</button><button class="ok" id="drawYes">Accept</button></div>
    <div class="status" id="status" role="status" aria-live="polite">&nbsp;</div>
    <div class="movesRow">
      <button class="nb" id="navFirst" aria-label="First move"><svg class="ic"><use href="#i-skipL"/></svg></button>
      <button class="nb" id="navPrev" aria-label="Previous move"><svg class="ic"><use href="#i-chevL"/></svg></button>
      <div class="moves" id="moves"><span class="none">Moves appear here</span></div>
      <button class="nb" id="navNext" aria-label="Next move"><svg class="ic"><use href="#i-chevR"/></svg></button>
      <button class="nb" id="navLast" aria-label="Back to live position"><svg class="ic"><use href="#i-skipR"/></svg></button>
    </div>
    <div class="actions" id="actions"></div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<div class="sheetBack" id="sheetBack"></div>

<section class="sheet" id="menuSheet" role="dialog" aria-label="Menu">
  <div class="sheetGrab"></div>
  <div class="sheetHead"><span>Menu</span><button id="menuClose" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div class="menuList">
    <button class="menuRow" id="soundToggle" data-svg="1" aria-pressed="true"><span class="mi"><svg class="ic"><use href="#i-volume"/></svg></span><span class="grow">Game sounds</span><span class="switch on"></span></button>
    <button class="menuRow" id="flipMenu"><span class="mi"><svg class="ic"><use href="#i-flip"/></svg></span><span class="grow">Flip board</span></button>
    <button class="menuRow" id="pgnMenu"><span class="mi"><svg class="ic"><use href="#i-book"/></svg></span><span class="grow">Copy game (PGN)<small>Paste into Lichess or chess.com to analyse</small></span></button>
    <button class="menuRow" id="watchMenuBtn" style="display:none"><span class="mi"><svg class="ic"><use href="#i-share"/></svg></span><span class="grow">Share &amp; viewers<small>Invite friends to watch</small></span><span class="chev"><svg class="ic"><use href="#i-chevron"/></svg></span></button>
    <button class="menuRow" id="homeBtn"><span class="mi"><svg class="ic"><use href="#i-home"/></svg></span><span class="grow">Leave to home</span><span class="chev"><svg class="ic"><use href="#i-chevron"/></svg></span></button>
  </div>
</section>
<section class="sheet" id="watchSheet" role="dialog" aria-label="Viewers and sharing">
  <div class="sheetGrab"></div>
  <div class="sheetHead"><span id="watchTitle">Watch &amp; share</span><button id="watchClose" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div class="sheetBody" id="watchBody"></div>
</section>
<section class="sheet" id="chatSheet" role="dialog" aria-label="Live chat">
  <div class="sheetGrab"></div>
  <div class="sheetHead"><span>Live chat</span><button id="chatClose" aria-label="Close chat"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div class="chatMessages" id="chatMessages"></div>
  <div class="chatNote" id="chatNote"></div>
  <div class="chatComposer"><input id="chatInput" maxlength="240" placeholder="Say something…" enterkeyhint="send" autocomplete="off"><button id="chatSend">Send</button></div>
</section>

<div class="modal" id="nameModal"><div class="modalCard"><h3 id="nameTitle">What's your name?</h3><div class="sub" id="nameSub">Your opponent will see it at the board.</div><input class="nameInput" id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname" enterkeyhint="go"><div class="resultActions"><button class="resultAction primary" id="nameGo">Continue</button></div></div></div>
<div class="modal" id="confirmModal"><div class="modalCard"><h3 id="confirmTitle">Resign this game?</h3><div class="sub" id="confirmText">You will lose the game.</div><div class="resultActions"><button class="resultAction" id="confirmNo">Keep playing</button><button class="resultAction primary" id="confirmYes">Resign</button></div></div></div>
<div class="modal" id="overModal"><div class="modalCard" style="text-align:center"><div class="resultBig" id="overTitle">Game over</div><div class="sub" id="overSub"></div><div class="rematchState" id="overRematch"></div><div class="resultActions" id="overActions"></div></div></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var MODE = params.get('mode') || 'computer', ACTION = params.get('action') || '';
  var spectatorMode = MODE === 'watch' || ACTION === 'spectate';
  var isComputer = MODE === 'computer';
  var profileName = (params.get('name') || '').trim().slice(0, 24);
  var watchToken = (params.get('watchToken') || params.get('watch') || '').trim();
  var requestedCode = (params.get('code') || '').trim().toUpperCase();
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var G = window.CPChessGame, PRESET = G.PRESETS;
  var socket = null, roomCode = '', playerToken = '', myIndex = -1, myColor = null, state = null, roomPlayers = [], tcInfo = null;
  var game = null, worker = null, aiColor = null, level = 3, thinkId = 0, thinking = false, aiTimer = null;
  var manualFlip = false, review = null, fenCache = null, anchor = null, over = { seq: -1 }, myRematch = false, drawTone = 0;
  var aud = { viewerCount: 0, totalViews: 0, visibility: 'link', chatEnabled: true, audience: [], muted: [] };
  var feedItems = [], chatMessages = [], unread = 0, myKey = null, roomReady = false, lastTurnCue = null, opponentGone = false;
  var viewerId = (function () { try { var v = localStorage.getItem('codeplay_viewer_id'); if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : 'v' + Date.now() + Math.random().toString(36).slice(2)); localStorage.setItem('codeplay_viewer_id', v); } return v; } catch (e) { return 'v' + Math.random().toString(36).slice(2); } })();
  var STORE = 'codeplay_chess_room';

  /* ------------------------------------------------------------------ helpers */
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function icon(name, cls) { return window.cpIcon ? cpIcon(name, cls) : ''; }
  var toastTimer;
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2600); }
  function play(cue) { if (window.CodePlayAudio) CodePlayAudio.play(cue); }
  function buzz(ms) { if (navigator.vibrate && !REDUCED) try { navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  function other(c) { return c === 'w' ? 'b' : 'w'; }
  function fmt(ms, running) {
    var s = Math.max(0, ms) / 1000;
    if (s >= 20 || !running) { var m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }
    return s.toFixed(1);
  }
  function tcLabel(tc) { if (!tc || !tc.base) return 'No clock'; return (tc.base % 60 === 0 ? tc.base / 60 : (tc.base / 60).toFixed(1)) + ' min' + (tc.inc ? ' + ' + tc.inc + 's' : ''); }
  var REASONS = { checkmate: 'checkmate', resign: 'resignation', timeout: 'time', 'timeout-draw': 'time, but no side can mate', stalemate: 'stalemate', insufficient: 'insufficient material', repetition: 'threefold repetition', 'fifty-move': 'the fifty-move rule', agreement: 'agreement', abandoned: 'abandonment', aborted: 'abort' };
  function names() {
    var n = { w: 'White', b: 'Black' };
    if (isComputer) { n[myColor || 'w'] = profileName || 'You'; n[aiColor || 'b'] = 'Computer · Lv ' + level; return n; }
    roomPlayers.forEach(function (p) { if (p.color) n[p.color] = p.name; });
    return n;
  }
  function resultText(r) {
    if (!r) return '';
    var n = names();
    if (r.reason === 'aborted') return 'Game aborted';
    if (!r.winner) return 'Draw by ' + (REASONS[r.reason] || r.reason);
    return n[r.winner] + (n[r.winner] === 'You' ? ' win' : ' wins') + ' by ' + (REASONS[r.reason] || r.reason);
  }

  /* ------------------------------------------------------------------ board */
  var board = CPBoard.mount($('board'), {
    onMove: function (from, to, promotion) { sendMove(from, to, promotion); },
    pickPromotion: pickPromotion
  });
  function pickPromotion(color, to, orient) {
    return new Promise(function (resolve) {
      var host = $('promoHost'), file = 'abcdefgh'.indexOf(to[0]), rank = +to[1], x = orient === 'w' ? file : 7 - file, top = (orient === 'w' && rank === 8) || (orient === 'b' && rank === 1);
      host.innerHTML = '';
      var back = el('div', 'promoBack'), box = el('div', 'promo');
      box.style.left = (x * 12.5) + '%'; box.style[top ? 'top' : 'bottom'] = '0';
      var order = top ? ['q', 'n', 'r', 'b'] : ['b', 'r', 'n', 'q'];
      var armed = false; setTimeout(function () { armed = true; }, 380);   // the click that follows the tap which opened the picker must not choose a piece
      order.forEach(function (p) { var b = el('button', color + p.toUpperCase()); b.setAttribute('aria-label', 'Promote to ' + ({ q: 'queen', r: 'rook', b: 'bishop', n: 'knight' })[p]); b.onclick = function (ev) { ev.stopPropagation(); if (!armed) return; host.innerHTML = ''; resolve(p); }; box.appendChild(b); });
      back.onclick = function () { if (!armed) return; host.innerHTML = ''; resolve(null); };
      host.appendChild(back); host.appendChild(box);
      var wrap = document.querySelector('.boardWrap'); host.style.cssText = 'position:absolute;inset:0;z-index:50';
    });
  }

  /* ------------------------------------------------------------------ rendering */
  function computeFens() {
    if (fenCache && fenCache.n === state.san.length) return fenCache;
    var c = new Chess(), fens = [c.fen()], lasts = [null];
    state.san.forEach(function (s) { var m = c.move(s); fens.push(c.fen()); lasts.push({ from: m.from, to: m.to }); });
    fenCache = { n: state.san.length, fens: fens, lasts: lasts }; return fenCache;
  }
  function orientation() { var base = myColor || 'w'; return manualFlip ? other(base) : base; }
  function renderCaptured(box, color) {
    box.innerHTML = '';
    var list = (state.captured && state.captured[color]) || [], opp = other(color);
    list.forEach(function (t) { var s = el('span', 'cp ' + opp + t.toUpperCase()); box.appendChild(s); });
    var diff = state.material[color] - state.material[opp];
    if (diff > 0) box.appendChild(el('span', 'md', '+' + diff));
  }
  function render(extra) {
    extra = extra || {};
    if (!state) return;
    var n = names(), orient = orientation(), top = other(orient), bottom = orient;
    board.setOrientation(orient);
    // player bars
    [['Top', top], ['Bottom', bottom]].forEach(function (pair) {
      var pos = pair[0], c = pair[1];
      $('name' + pos).textContent = n[c] + (myColor === c && !isComputer ? ' (you)' : '');
      var av = $('av' + pos); av.className = 'av ' + c; av.textContent = (n[c] || '?').trim().charAt(0).toUpperCase() || '?';
      var dot = isComputer ? null : roomPlayers.filter(function (p) { return p.color === c; })[0];
      if (dot) { var i = el('i', dot.connected ? '' : 'off'); av.appendChild(i); }
      renderCaptured($('cap' + pos), c);
      $('bar' + pos).classList.toggle('turn', !state.gameOver && state.turn === c && review == null);
    });
    // board
    var viewing = review != null ? computeFens() : null;
    if (viewing) {
      var fake = { fen: viewing.fens[review], turn: 'x', dests: {}, promos: [], last: viewing.lasts[review], check: null };
      board.set(fake, { animate: extra.animate !== false });
    } else {
      board.set(state, { animate: extra.animate !== false && !extra.resync && !extra.first, hint: extra.hint });
    }
    var canMove = !!myColor && !state.gameOver && review == null && !spectatorMode && (isComputer ? !thinking : roomReady);
    board.setInteractive(canMove, myColor);
    renderStatus(extra); renderMoves(); renderActions(); updateClocks();
    $('drawBanner').classList.toggle('show', !!(myColor && state.drawOffer && state.drawOffer !== myColor && !state.gameOver));
    ['navFirst', 'navPrev', 'navNext', 'navLast'].forEach(function (id) { $(id).disabled = state.san.length === 0; });
    $('navFirst').disabled = state.san.length === 0 || (review === 0);
    $('navPrev').disabled = state.san.length === 0 || (review === 0);
    $('navNext').disabled = review == null;
    $('navLast').disabled = review == null;
    if (state.gameOver && over.seq !== state.seq) { over.seq = state.seq; setTimeout(showGameOver, review == null ? 700 : 0); }
    if (!state.gameOver) $('overModal').classList.remove('show');
  }
  function renderStatus(extra) {
    var s = $('status'), msg = '', alert = false;
    if (state.gameOver) msg = resultText(state.result);
    else if (review != null) msg = 'Move ' + review + ' of ' + state.san.length + ' — tap ⏭ for the live position';
    else if (spectatorMode) msg = names()[state.turn] + ' to move' + (state.check ? ' — check!' : '');
    else if (state.drawOffer && state.drawOffer === myColor) msg = 'Draw offered — waiting for a reply…';
    else if (state.turn === myColor) { msg = state.check ? 'Check! Your move' : 'Your move'; alert = !!state.check; }
    else if (isComputer) msg = 'Computer is thinking…';
    else if (opponentGone) { msg = 'Your opponent disconnected — they have 90 seconds to come back'; alert = true; }
    else msg = 'Waiting for ' + names()[state.turn];
    s.textContent = msg; s.classList.toggle('alert', alert);
  }
  function renderMoves() {
    var box = $('moves'), san = state.san, cur = review != null ? review : san.length;
    if (!san.length) { box.innerHTML = '<span class="none">Moves appear here</span>'; return; }
    var html = '';
    san.forEach(function (m, i) { if (i % 2 === 0) html += '<span class="mn">' + (i / 2 + 1) + '.</span>'; html += '<button class="mv' + (i + 1 === cur ? ' cur' : '') + '" data-ply="' + (i + 1) + '">' + m.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</button>'; });
    box.innerHTML = html;
    var c = box.querySelector('.cur'); if (c) box.scrollLeft = c.offsetLeft - box.clientWidth / 2 + c.clientWidth / 2;
  }
  $('moves').addEventListener('click', function (e) { var b = e.target.closest('.mv'); if (b) goReview(+b.dataset.ply); });
  function goReview(ply) { if (!state) return; review = ply >= state.san.length ? null : Math.max(0, ply); render({ animate: true }); }
  $('navFirst').onclick = function () { goReview(0); };
  $('navPrev').onclick = function () { goReview((review == null ? state.san.length : review) - 1); };
  $('navNext').onclick = function () { goReview((review == null ? state.san.length : review) + 1); };
  $('navLast').onclick = function () { goReview(state.san.length); };
  addEventListener('keydown', function (e) { if (!state || document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowLeft') $('navPrev').click(); else if (e.key === 'ArrowRight') $('navNext').click(); else if (e.key === 'Escape') closeSheets(); });

  /* clocks */
  function setAnchor(st) { anchor = { w: st.clocks.w, b: st.clocks.b, running: st.running, at: Date.now(), timed: st.timeControl.base > 0 }; }
  function liveClock(c) { if (!anchor) return 0; return anchor[c] - (anchor.running === c ? Date.now() - anchor.at : 0); }
  var lastLowBeep = 0;
  function updateClocks() {
    if (!state || !anchor) return;
    var orient = orientation();
    [['Top', other(orient)], ['Bottom', orient]].forEach(function (pair) {
      var node = $('clock' + pair[0]), c = pair[1];
      if (!anchor.timed) { node.classList.add('none'); return; }
      node.classList.remove('none');
      var ms = Math.max(0, liveClock(c)), running = anchor.running === c && !state.gameOver;
      node.textContent = fmt(ms, running);
      node.classList.toggle('run', running); node.classList.toggle('low', running && ms < 10000);
      if (running && ms < 10000 && c === myColor && Date.now() - lastLowBeep > 1000 && ms > 0) { lastLowBeep = Date.now(); play('chess-low'); }
    });
  }
  setInterval(function () {
    updateClocks();
    if (isComputer && game && !game.gameOver) { var f = game.tick(Date.now()); if (f || game.gameOver) applyLocal({}); }
  }, 100);

  function renderActions() {
    var box = $('actions'); box.innerHTML = '';
    var plies = state.san.length, ended = state.gameOver;
    function act(id, ic, label, fn, opts) { opts = opts || {}; var b = el('button', 'act' + (opts.danger ? ' danger' : '')); b.innerHTML = icon(ic) + '<span>' + label + '</span>'; b.disabled = !!opts.disabled; b.onclick = fn; b.id = id; box.appendChild(b); }
    act('aFlip', 'flip', 'Flip', function () { manualFlip = !manualFlip; render({ animate: false }); });
    if (spectatorMode) { act('aShare', 'share', 'Share', function () { openSheet('watch'); }); return; }
    if (isComputer) {
      act('aUndo', 'undo', 'Undo', undoMove, { disabled: ended || plies < 2 || !!anchor.timed || thinking });
      act('aHint', 'bulb', 'Hint', hint, { disabled: ended || thinking || state.turn !== myColor });
      act('aDraw', 'handshake', 'Draw', offerDrawToComputer, { disabled: ended || plies < 2 || thinking });
    } else {
      act('aDraw', 'handshake', 'Draw', function () { socket.emit('chess:offer-draw', { code: roomCode }); toast('Draw offered'); }, { disabled: ended || plies < 2 || !!state.drawOffer });
      act('aShare', 'share', 'Invite', function () { openSheet('watch'); });
    }
    act('aResign', 'flag', plies < 2 ? 'Abort' : 'Resign', function () { askConfirm(plies < 2 ? 'Abort this game?' : 'Resign this game?', plies < 2 ? 'No result will be recorded.' : 'Your opponent will win.', plies < 2 ? 'Abort' : 'Resign', resign); }, { danger: true, disabled: ended });
  }
  function askConfirm(title, text, yes, fn) {
    $('confirmTitle').textContent = title; $('confirmText').textContent = text; $('confirmYes').textContent = yes;
    $('confirmModal').classList.add('show');
    $('confirmNo').onclick = function () { $('confirmModal').classList.remove('show'); };
    $('confirmYes').onclick = function () { $('confirmModal').classList.remove('show'); fn(); };
  }

  /* ------------------------------------------------------------------ game over */
  function showGameOver() {
    if (!state || !state.gameOver) return;
    var r = state.result, t = $('overTitle'), sub = $('overSub'), actions = $('overActions');
    var mine = r.winner && myColor === r.winner, lost = r.winner && myColor && myColor !== r.winner;
    t.className = 'resultBig' + (mine ? ' win' : lost ? ' loss' : '');
    t.textContent = r.reason === 'aborted' ? 'Game aborted' : !r.winner ? 'Draw' : spectatorMode ? names()[r.winner] + ' wins' : mine ? 'You won!' : 'You lost';
    sub.textContent = r.reason === 'aborted' ? '' : resultText(r);
    actions.innerHTML = '';
    function btn(cls, ic, label, fn) { var b = el('button', 'resultAction ' + cls); b.innerHTML = (ic ? icon(ic) + ' ' : '') + label; b.onclick = fn; actions.appendChild(b); return b; }
    if (!spectatorMode) btn('primary', 'refresh', 'Rematch', function () { requestRematch(); });
    btn('', 'book', 'PGN', copyPgn);
    btn('', 'eye', 'Review', function () { $('overModal').classList.remove('show'); goReview(state.san.length ? state.san.length - 1 : 0); });
    btn('', 'home', 'Home', function () { location.href = '/'; });
    $('overRematch').textContent = '';
    $('overModal').classList.add('show');
    if (mine) buzz([30, 40, 30, 40, 60]);
  }
  $('overModal').addEventListener('click', function (e) { if (e.target === $('overModal')) $('overModal').classList.remove('show'); });
  function pgnText() {
    var n = names(), res = !state.result ? '*' : state.result.winner === 'w' ? '1-0' : state.result.winner === 'b' ? '0-1' : '1/2-1/2', out = '';
    out += '[Event "CodePlay game"]\n[Site "CodePlay"]\n[Date "' + new Date().toISOString().slice(0, 10).replace(/-/g, '.') + '"]\n[White "' + n.w + '"]\n[Black "' + n.b + '"]\n[Result "' + res + '"]\n\n';
    state.san.forEach(function (m, i) { out += (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + m + ' '; });
    return out + res;
  }

      [['public', 'globe', 'Public'], ['link', 'link', 'Link only'], ['private', 'lock', 'Off']].forEach(function (o) { var b = el('button', vis === o[0] ? 'on' : ''); b.innerHTML = icon(o[1]) + '<span>' + o[2] + '</span>'; b.onclick = function () { if (aud.visibility !== o[0]) setOpt({ visibility: o[0] }); }; seg.appendChild(b); });
      body.appendChild(seg);
      body.appendChild(el('div', 'hintTxt', vis === 'public' ? 'Anyone can find this match under “Watch live”.' : vis === 'link' ? 'Only people with your private watch link can watch. Recommended.' : 'Nobody can watch. Anyone already watching is removed.'));
      body.appendChild(el('div', 'secTitle', 'Viewer options'));
      body.appendChild(switchRow('Allow viewer chat', 'Players can always chat.', aud.chatEnabled, function () { setOpt({ chatEnabled: !aud.chatEnabled }); }));
    }
    body.appendChild(el('div', 'secTitle', 'Watching now (' + aud.audience.length + ')'));
    if (!aud.audience.length) body.appendChild(el('div', 'emptyTxt', 'No viewers yet. Share the link to invite friends!'));
    aud.audience.slice(0, 60).forEach(function (v) {
      var row = el('div', 'viewerRow'); row.appendChild(el('span', null, v.name + (v.key === myKey ? ' (you)' : '')));
      if (host) { var muted = aud.muted.indexOf(v.key) >= 0, b = el('button', 'smallBtn' + (muted ? ' on' : ''), muted ? 'Unmute' : 'Mute'); b.onclick = function () { socket.emit('chess:mute-viewer', { code: roomCode, key: v.key, muted: !muted }); }; row.appendChild(b); }
      body.appendChild(row);
    });
    body.appendChild(el('div', 'secTitle', 'Recent activity'));
    if (!feedItems.length) body.appendChild(el('div', 'emptyTxt', 'Moves will appear here as the game goes on.'));
    feedItems.slice(-10).reverse().forEach(function (f) { body.appendChild(el('div', 'fi', f.text)); });
  }
  var BADGE = { host: 'HOST', player: 'PLAYER', spectator: 'VIEWER' };
  function renderChat() {
    var box = $('chatMessages'); box.innerHTML = '';
    if (!chatMessages.length) { box.appendChild(el('div', 'emptyTxt', 'No messages yet — say hi')); return; }
    chatMessages.slice(-60).forEach(function (m) {
      var row = el('div', 'chatMsg ' + (m.role || 'spectator')); row.appendChild(el('span', 'badge ' + (m.role || 'spectator'), BADGE[m.role] || BADGE.spectator));
      row.appendChild(el('b', null, (m.name || 'Guest') + ': ')); row.appendChild(el('span', null, m.text || ''));
      if (isHost() && m.role === 'spectator' && m.key) { var mt = aud.muted.indexOf(m.key) >= 0, b = el('button', 'mute', mt ? 'unmute' : 'mute'); b.onclick = function () { socket.emit('chess:mute-viewer', { code: roomCode, key: m.key, muted: !mt }); }; row.appendChild(b); }
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  }
  function renderChatState() { var off = spectatorMode && !aud.chatEnabled; $('chatInput').disabled = off; $('chatSend').disabled = off; $('chatInput').placeholder = off ? 'Chat is off for viewers' : 'Say something…'; $('chatNote').textContent = off ? 'The host turned chat off for viewers.' : ''; $('chatNote').classList.toggle('show', off); }
  function onChat(m) { chatMessages.push(m); chatMessages = chatMessages.slice(-100); var mine = spectatorMode ? (m.role === 'spectator' && m.key && m.key === myKey) : (m.role !== 'spectator' && m.name === profileName); if (chatOpen) renderChat(); else if (!mine) { unread++; renderTop(); } }
  function sendChat() { var t = String($('chatInput').value || '').trim(); if (!t || !socket || !roomCode) return; socket.emit('chess:chat-message', { code: roomCode, text: t }); $('chatInput').value = ''; }

  $('menuBtn').onclick = openMenu; $('menuClose').onclick = function () { closeSheets(); };
  $('watchTopBtn').onclick = function () { openSheet('watch'); }; $('watchMenuBtn').onclick = function () { openSheet('watch'); };
  $('chatTopBtn').onclick = function () { openSheet('chat'); };
  $('watchClose').onclick = function () { closeSheets(); }; $('chatClose').onclick = function () { closeSheets(); }; $('sheetBack').onclick = function () { closeSheets(); };
  $('chatSend').onclick = sendChat; $('chatInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendChat(); });
  $('flipMenu').onclick = function () { closeSheets(); manualFlip = !manualFlip; if (state) render({ animate: false }); };
  if (window.visualViewport) { var upd = function () { var vv = window.visualViewport; document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px'); }; visualViewport.addEventListener('resize', upd); visualViewport.addEventListener('scroll', upd); }

  /* ------------------------------------------------------------------ start */
  level = Math.max(1, Math.min(6, +params.get('level') || 3));
  if (!isComputer) {
    try { var saved = JSON.parse(sessionStorage.getItem(STORE) || 'null'); if (saved && saved.token && !spectatorMode && (ACTION === 'create' || ACTION === 'reconnect' || saved.code === requestedCode)) { roomCode = saved.code; playerToken = saved.token; if (!requestedCode) requestedCode = saved.code; } } catch (e) { /* ignore */ }
  }
  var urlTok = (params.get('playerToken') || '').trim();
  if (urlTok && requestedCode && !spectatorMode && !isComputer) { roomCode = requestedCode; playerToken = urlTok; }
  var needsName = !(roomCode && playerToken);
  (needsName ? ensureName() : Promise.resolve()).then(function () {
    if (isComputer) newComputerGame(false);
    else { showWaiting('Connecting…'); connect(); }
  });
  window.__chess = { get state() { return state; }, get game() { return game; }, board: board };
})();
