<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodePlay Live — Ludo</title>
<meta name="theme-color" content="#06100c">
<meta name="description" content="Watch a live Ludo match on CodePlay and cheer the players on.">
<meta property="og:site_name" content="CodePlay">
<meta property="og:type" content="website">
<meta property="og:title" content="🎲 Watch a live Ludo match on CodePlay">
<meta property="og:description" content="Tap to watch, chat and cheer — no sign-up needed.">
<meta property="og:image" content="https://codeplay-ludo-production.up.railway.app/og-ludo.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/theme.css?v=4"><link rel="stylesheet" href="/appbar.css?v=4"><link rel="stylesheet" href="/ludo.css?v=4"><script src="/icons.js?v=4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="/ludo-board.js?v=4"></script>
<style>
body.liveLudo{display:block;height:auto;min-height:100dvh;overflow:auto;padding-bottom:calc(88px + var(--safe-b))}
.appbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent)}
.livePill #viewsChip:before{content:'';display:inline-block;width:1px}
.livePill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;font-weight:850}
.livePill i{width:8px;height:8px;border-radius:50%;background:#ff4b4b;animation:blink 1.2s ease-in-out infinite}
.livePill.off i{background:#8a8a8a;animation:none}
@keyframes blink{50%{opacity:.35}}
.wrapPage{width:min(100%,560px);margin:0 auto;padding:0 10px}
.shareRow{display:flex;gap:8px;margin:2px 0 10px}.shareRow button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:850;font-size:13px;padding:0 8px;white-space:nowrap}.shareRow .wa{background:linear-gradient(135deg,#25d366,#128c4a);color:#04130b;border:0}
.stage{padding:4px 0;flex:none}
#wrap{width:100%;max-width:520px}
#playersPanel{padding:8px 0}
.panel{margin-top:10px;border-radius:var(--r-md);background:linear-gradient(180deg,rgba(21,43,35,.9),rgba(10,24,19,.9));border:1px solid var(--line);overflow:hidden}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;font-weight:900;font-size:14px;border-bottom:1px solid var(--line)}
.panelHead small{color:var(--muted);font-weight:700}
.feedNow{font-size:12px;font-weight:700;color:var(--gold);max-width:60%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed{padding:4px 14px 10px;max-height:150px;overflow:auto}
.messages{padding:6px 14px;max-height:230px;min-height:80px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.msg{font-size:14px;line-height:1.4;word-break:break-word}.msg b{font-weight:850}.msg .time{font-size:10px;color:var(--muted);margin-left:4px}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;min-height:48px;padding:0 13px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);font-size:16px}
.composer button{min-width:76px;min-height:48px;border-radius:13px;background:#2a7bf6;color:#fff;font-weight:850}.composer button:disabled,.composer input:disabled{opacity:.45}
.audience{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700}
.reactionBar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.reaction{min-width:46px;min-height:46px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line);font-size:20px;transition:transform .14s var(--ease-out)}.reaction:active{transform:scale(.88)}
.floatReaction{position:fixed;bottom:90px;font-size:34px;pointer-events:none;z-index:70;animation:floatUp 1.7s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translateY(-190px) scale(1.15)}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:14px}
.fi{font-size:13px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}.fi:first-child{border-top:0}
.statline{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.dicePeek{display:flex;gap:12px;justify-content:center;margin:10px 0 2px}
.dicePeek .diceBox{width:52px;height:52px}
.blocked{display:none;position:fixed;inset:0;z-index:120;background:var(--bg);align-items:flex-start;justify-content:center;padding:14vh 16px 0}.blocked.show{display:flex}
</style>
</head>
<body class="ludoPage liveLudo">
<header class="appbar">
  <a class="brandLink" href="/" aria-label="CodePlay home"><span class="logoMark"><svg class="ic" aria-hidden="true"><use href="#i-dice"/></svg></span></a>
  <div class="brand"><b>CodePlay Live</b><span id="roomSub">Ludo spectator view</span></div>
  <div class="barActions"><span class="livePill off" id="livePill"><i></i><span id="statusText">CONNECTING</span><span id="viewsChip">0</span></span><a class="roundBtn" href="/" aria-label="Home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></a></div>
</header>
<div class="wrapPage">
  <div class="shareRow"><button class="wa" id="waBtn"><svg class="ic" aria-hidden="true"><use href="#i-whatsapp"/></svg> Share on WhatsApp</button><button id="copyBtn"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg> Copy link</button></div>
  <div id="playersPanel" aria-label="Players"></div>
  <main class="stage"><div id="wrap"><div id="grid"></div><div id="tokens"></div></div></main>
  <div class="dicePeek"><div class="diceBox"><div class="die3d" id="die1"><div class="dieFace" id="face1"></div></div></div><div class="diceBox"><div class="die3d" id="die2"><div class="dieFace" id="face2"></div></div></div></div>
  <div id="status" role="status" style="margin:8px auto 0">Connecting…</div>

  <section class="panel"><div class="panelHead"><span>Live moves</span><span class="feedNow" id="feedNow"></span></div><div class="feed" id="feed"><div class="empty">Moves will appear here as the match goes on.</div></div></section>
  <section class="panel"><div class="panelHead"><span>Live chat</span><small id="chatHint">Viewers &amp; players</small></div><div id="messages" class="messages"></div><div class="chatNote" id="chatNote"></div><div class="composer"><input id="chatInput" maxlength="240" placeholder="Comment on the match…" enterkeyhint="send" autocomplete="off"><button id="sendChat">Send</button></div></section>
  <section class="panel"><div class="panelHead"><span>Audience</span><small id="audienceSummary">0 watching</small></div><div id="audience" class="audience"><span class="pill">No viewers yet</span></div></section>
</div>
<div class="reactionBar">
  <button class="reaction" data-r="🔥" aria-label="Fire">🔥</button><button class="reaction" data-r="😂" aria-label="Laugh">😂</button><button class="reaction" data-r="😱" aria-label="Wow">😱</button><button class="reaction" data-r="👏" aria-label="Clap">👏</button><button class="reaction" data-r="💀" aria-label="Skull">💀</button><button class="reaction" data-r="❤️" aria-label="Love">❤️</button><button class="reaction" data-r="🎉" aria-label="Party">🎉</button>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="blocked" class="blocked"><div class="blockedCard"><h3 id="blockedTitle"></h3><p id="blockedText"></p><a href="/">Home</a><a href="/?screen=live">Watch live games</a></div></div>
<div class="modal" id="nameOverlay"><div class="modalCard"><h3>Watch live</h3><div class="sub">What should we call you in the chat?</div><input class="nameInput" id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname" enterkeyhint="go"><div class="resultActions"><button class="resultAction primary" id="nameGo">Start watching</button></div></div></div>
<div class="modal" id="finishOverlay"><div class="modalCard"><h3 id="finishTitle">Match complete</h3><div class="sub" id="finishText"></div><div class="resultActions"><button class="resultAction primary" id="finishOk">Continue watching</button><button class="resultAction" onclick="location.href='/?screen=live'">More live games</button></div></div></div>

<script>
const params=new URLSearchParams(location.search);
let code=(params.get('code')||location.pathname.split('/').pop()||'').trim().toUpperCase();
const watchToken=params.get('watch')||'';
const viewerId=(()=>{try{let v=localStorage.getItem('codeplay_viewer_id');if(!v){v='v_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('codeplay_viewer_id',v)}return v}catch(e){return 'v_'+Math.random().toString(36).slice(2)}})();
let viewerName=(params.get('name')||localStorage.getItem('codeplay_viewer_name')||'').slice(0,24);
let socket=null,socketUrl=window.CODEPLAY_SOCKET_URL||location.origin,myKey=null,feedItems=[],chat=[],aud={},players=[],turn=0,gameOver=false,finishOrder=[],lastPos={},panelSig='',viewerSet=false;
const $=id=>document.getElementById(id);
const board=LudoBoard.mount({wrap:$('wrap'),grid:$('grid'),tokens:$('tokens')});
const HOME_BASE_POS=LudoBoard.HOME_BASE_POS,globalCell=LudoBoard.globalCell,COLORHEX=LudoBoard.COLORHEX,cap=LudoBoard.cap;
LudoBoard.buildFace($('face1'));LudoBoard.buildFace($('face2'));LudoBoard.showFace($('face1'),1);LudoBoard.showFace($('face2'),1);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>el.classList.remove('show'),2600)}

const FRIENDLY={'spectator-access-denied':['Link-only match','This match can only be watched with the host’s watch link. Ask the host to send it to you.'],'watch-not-authorized':['Link-only match','This watch link is private or has expired. Ask the host for a fresh link.'],'spectating-disabled':['Watching is off','The host has turned off watching for this match.'],'room-not-found':['Match not found','This room does not exist or the match has already ended.'],'audience-full':['Audience is full','This match has reached its viewer limit. Try again in a moment.']};
const SOFT={'chat-disabled':'The host turned chat off for viewers.','muted':'The host muted you in this chat.','chat-rate-limit':'Slow down a little','empty-message':'Type a message first.','not-in-room':'You are not in this match.'};
function showBlocked(t,x){$('blockedTitle').textContent=t;$('blockedText').textContent=x;$('blocked').classList.add('show');$('statusText').textContent='UNAVAILABLE';$('livePill').classList.add('off')}

/* ---------- board ---------- */
function renderBoard(){
  const items=[];
  players.forEach(p=>{const colors=Array.isArray(p.colors)&&p.colors.length?p.colors:Object.keys(p.tokens||{});colors.forEach(color=>{((p.tokens&&p.tokens[color])||[]).forEach((pos,idx)=>{
    const key=color+':'+idx,done=pos===56,rc=pos===-1?HOME_BASE_POS[color][idx]:(done?[7,7]:globalCell(color,pos));
    items.push({key,color,idx,pos,r:rc[0],c:rc[1],done,movable:false});
    const prev=lastPos[key];if(prev!==undefined&&prev!==pos){if(prev>=0&&prev<=55)board.flash([globalCell(color,prev)]);if(pos>=0&&pos<=55)board.flash([rc])}lastPos[key]=pos;
  })})});
  board.render(items);
  const names={};players.forEach((p,i)=>(p.colors||[]).forEach(c=>names[c]=cap(p.name||('Player '+(i+1)))));
  board.setLabels(names);board.setTurn(gameOver||!players[turn]?[]:(players[turn].colors||[]));
  renderPlayers();
}
function renderPlayers(){
  const el=$('playersPanel');
  const sig=players.map((p,i)=>(p.name||'')+'|'+Object.values(p.tokens||{}).flat().filter(v=>v===56).length+'|'+(i===turn&&!gameOver?1:0)+'|'+(p.connected===false?0:1)).join('~');
  if(sig===panelSig)return;panelSig=sig;el.innerHTML='';el.style.gridTemplateColumns='repeat('+Math.max(players.length,1)+',minmax(0,1fr))';el.dataset.n=players.length;
  players.forEach((p,i)=>{
    const colors=p.colors||Object.keys(p.tokens||{}),home=colors.reduce((n,c)=>n+((p.tokens&&p.tokens[c])||[]).filter(v=>v===56).length,0);
    const card=document.createElement('div');card.className='pcard'+(i===turn&&!gameOver?' turn':'');
    card.innerHTML='<div class="pn"><span class="pdots">'+colors.map(c=>'<i style="--c:'+COLORHEX[c]+'"></i>').join('')+'</span><span class="nm">'+esc(cap(p.name||('Player '+(i+1))))+'</span></div><div class="pm"><span><span class="on'+(p.connected===false?' off':'')+'"></span><span class="olTxt">'+(p.connected===false?'away':'online')+'</span></span><span>'+home+'/'+(colors.length*4)+'</span></div>';
    el.appendChild(card);
  });
}
function applyState(s){
  if(!s)return;
  players=(s.players||[]).map((p,i)=>Object.assign({},players[i]||{},p));
  turn=Number.isFinite(s.turn)?s.turn:0;gameOver=!!s.gameOver;finishOrder=s.finishOrder||[];
  renderBoard();
  const live=gameOver?'FINISHED':'LIVE';
  $('statusText').textContent=live;$('livePill').classList.toggle('off',gameOver);
  $('status').textContent=gameOver?'Match finished':(players[turn]?cap(players[turn].name||'Player')+'’s turn':'Live');
  $('roomSub').textContent='Room '+code+' · '+players.length+' players';
  if(gameOver)showFinished();
}
function showFinished(){
  const winner=finishOrder.length&&players[finishOrder[0]]?players[finishOrder[0]].name:null;
  $('finishTitle').textContent=winner?cap(winner)+' wins the match!':'Match complete';
  $('finishText').textContent=(aud.views||0)+' total views · '+(aud.messages||chat.length||0)+' comments · '+(aud.reactions||0)+' reactions';
  $('finishOverlay').classList.add('show');
}
/* ---------- audience, chat, feed ---------- */
function updateAudience(a){
  aud=Object.assign({},aud,a||{});
  const w=Number(aud.watching??aud.viewerCount??0);
  $('viewsChip').innerHTML=cpIcon('eye','sm')+' '+w;$('audienceSummary').textContent=w+' watching';
  $('audience').innerHTML=(aud.audience||[]).map(v=>'<span class="pill">'+esc(v.name)+(v.key===myKey?' (you)':'')+'</span>').join('')||'<span class="pill">No viewers yet</span>';
  const off=aud.chatEnabled===false,i=$('chatInput'),b=$('sendChat'),n=$('chatNote');
  i.disabled=off;b.disabled=off;i.placeholder=off?'Chat is off for viewers':'Comment on the match…';n.textContent=off?'The host turned chat off for viewers.':'';n.classList.toggle('show',off);
}
const BADGE={host:'HOST',player:'PLAYER',spectator:'VIEWER'};
function renderChat(){
  const el=$('messages');el.innerHTML='';
  if(!chat.length){el.innerHTML='<div class="empty">No messages yet — say hi</div>';return}
  chat.slice(-100).forEach(m=>{const d=document.createElement('div');d.className='msg';const role=m.role||'spectator';d.innerHTML='<span class="badge '+esc(role)+'">'+(BADGE[role]||BADGE.spectator)+'</span><b>'+esc(m.name||'Guest')+'</b>: '+esc(m.text||'')+' <span class="time">'+new Date(m.at||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</span>';el.appendChild(d)});
  el.scrollTop=el.scrollHeight;
}
function renderFeed(){
  const box=$('feed'),last=feedItems[feedItems.length-1];$('feedNow').textContent=last?last.text:'';box.innerHTML='';
  if(!feedItems.length){box.innerHTML='<div class="empty">Moves will appear here as the match goes on.</div>';return}
  feedItems.slice(-12).reverse().forEach(f=>{const d=document.createElement('div');d.className='fi';d.textContent=f.text;box.appendChild(d)});
}
function floatEmoji(e){const d=document.createElement('div');d.className='floatReaction';d.textContent=e;d.style.left=(10+Math.random()*78)+'%';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
/* ---------- sharing ---------- */
function shareUrl(){const u=new URL(location.origin+'/live-ludo.html');u.searchParams.set('code',code);if(watchToken)u.searchParams.set('watch',watchToken);return u.toString()}
function shareText(){return '🎲 Watch this Ludo match live on CodePlay!\nRoom '+code+'\n'+shareUrl()}
function copyLink(){const text=shareUrl(),done=()=>toast('Link copied'),fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();ok?done():prompt('Copy this link',text)};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text).then(done).catch(fb):fb()}
$('waBtn').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank','noopener');
$('copyBtn').onclick=copyLink;
$('finishOk').onclick=()=>$('finishOverlay').classList.remove('show');
/* ---------- socket ---------- */
function connect(){
  if(socket)return;
  socket=io(socketUrl,{transports:['websocket','polling'],reconnection:true,reconnectionAttempts:Infinity});
  socket.on('connect',()=>{socket.emit('watch-room',{code,watchToken,name:viewerName||'Guest',viewerId})});
  socket.on('disconnect',()=>{$('statusText').textContent='RECONNECTING';$('livePill').classList.add('off')});
  socket.on('connect_error',()=>{$('statusText').textContent='RECONNECTING';$('livePill').classList.add('off')});
  socket.on('error-msg',m=>{if(SOFT[m]){toast(SOFT[m]);return}if(FRIENDLY[m]){showBlocked(FRIENDLY[m][0],FRIENDLY[m][1]);return}toast(String(m))});
  socket.on('feed',f=>{feedItems.push(f);feedItems=feedItems.slice(-40);renderFeed()});
  socket.on('spectator-ended',x=>{socket.disconnect();const f=x&&x.reason==='spectating-disabled'?FRIENDLY['spectating-disabled']:['Link-only now','The host switched this match to link-only. Ask them for the watch link to keep watching.'];showBlocked(f[0],f[1])});
  socket.on('spectator-ready',p=>{
    if(p.you){myKey=p.you.key;viewerName=p.you.name||viewerName}
    chat=(p.audience&&p.audience.chat)||p.chat||[];feedItems=(p.audience&&p.audience.feed)||[];renderFeed();updateAudience(p.audience||{});renderChat();
    if(p.state)applyState(p.state);else{$('statusText').textContent='WAITING';$('status').textContent='Waiting for the match to start…'}
  });
  socket.on('room-status',p=>{if(p.started)return;$('statusText').textContent='WAITING';$('status').textContent=(p.joined||0)+' / '+(p.needed||0)+' players connected';if(p.players){players=p.players.map(x=>Object.assign({},x,{tokens:{}}));renderPlayers()}});
  socket.on('player-joined',p=>toast((p.joined||0)+' / '+(p.needed||0)+' players connected'));
  socket.on('game-ready',p=>{if(p.state)applyState(p.state);if(p.audience)updateAudience(p.audience)});
  socket.on('move-applied',p=>{if(p.state)applyState(p.state)});
  socket.on('turn-passed',p=>{if(p.state)applyState(p.state)});
  socket.on('dice-rolled',p=>{if(p.dice&&p.dice.length===2)LudoBoard.rollDice($('die1'),$('face1'),$('die2'),$('face2'),p.dice[0],p.dice[1])});
  socket.on('audience-info',updateAudience);socket.on('audience-update',updateAudience);
  socket.on('chat-message',m=>{chat.push(m);if(chat.length>100)chat.shift();renderChat();updateAudience({messages:chat.length})});
  socket.on('reaction',p=>{floatEmoji(p.emoji||p.reaction||'🎉');if(p.total!=null)updateAudience({reactions:p.total})});
  socket.on('watch-settings-updated',p=>toast(p&&p.visibility==='public'?'Match is now public':p&&p.visibility==='link'?'Match is now link-only':'Watch settings updated'));
  socket.on('match-finished',p=>{if(p.state)applyState(p.state);if(p.audience)updateAudience(p.audience);showFinished()});
}
$('sendChat').onclick=()=>{const i=$('chatInput'),t=i.value.trim();if(!t||!socket)return;socket.emit('chat-send',{code,text:t});i.value=''};
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendChat').click()});
document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(socket)socket.emit('reaction',{code,emoji:b.dataset.r});floatEmoji(b.dataset.r)}));
function start(){fetch('/api/config/public').then(r=>r.json()).then(cfg=>{if(cfg.socketUrl&&!window.CODEPLAY_SOCKET_URL)socketUrl=cfg.socketUrl}).catch(()=>{}).finally(connect)}
if(viewerName){start()}else{
  let saved='';try{saved=localStorage.getItem('codeplay_name')||''}catch(e){}
  if(saved&&saved.toLowerCase()!=='guest'){viewerName=saved.slice(0,24);start()}
  else{const ov=$('nameOverlay'),inp=$('nameInput');ov.classList.add('show');const go=()=>{viewerName=(inp.value.trim()||'Guest').slice(0,24);try{localStorage.setItem('codeplay_viewer_name',viewerName)}catch(e){}ov.classList.remove('show');start()};$('nameGo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>inp.focus(),300)}
}
</script>
</body>
</html>
