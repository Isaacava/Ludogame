<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CodePlay Admin</title>
<style>
:root{--bg:#0b1411;--side:#0f1c17;--panel:#13241d;--panel2:#193028;--line:rgba(255,255,255,.09);--ink:#eaf2ee;--muted:#8fa69b;--gold:#ffd75a;--green:#2fd27a;--red:#ff6b78;--amber:#ffb84a;--blue:#58a6ff;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}.hide{display:none!important}.mut{color:var(--muted)}.sm{font-size:12px}.r{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.box h1{margin:0 0 4px;font-size:22px}input.f,select.f,textarea.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.25)}.btn.pri{background:var(--gold);color:#2a1c00;border:0}.btn.bad{background:var(--red);color:#2b0509;border:0}.btn.good{background:var(--green);color:#04210f;border:0}.btn.sm{min-height:30px;padding:0 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--red);min-height:18px;margin-top:8px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:16px;padding:4px 10px 14px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;margin-bottom:2px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.04)}.nav button.on{background:var(--panel2);color:var(--ink)}.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{padding:20px;min-width:0;max-width:1300px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar h2{margin:0;font-size:20px;flex:1}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}.card h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1}.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}.kpi .s{font-size:12px;margin-top:6px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.alert.bad{border-color:rgba(255,107,120,.5)}.alert.warn{border-color:rgba(255,184,74,.5)}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl th.r{text-align:right}.scroll{overflow:auto;border-radius:10px}.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--green);border-color:rgba(47,210,122,.5)}.pill.bad{color:var(--red);border-color:rgba(255,107,120,.5)}.pill.warn{color:var(--amber);border-color:rgba(255,184,74,.5)}.pill.blue{color:var(--blue);border-color:rgba(88,166,255,.5)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#52665d;margin-right:6px}.dot.online{background:var(--green)}.dot.playing{background:var(--amber)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:2px;min-width:0}.chart .bargrp{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100px}.chart i{display:block;width:30%;border-radius:3px 3px 0 0;min-height:1px}.chart .d{font-size:10px;color:var(--muted);text-align:center;overflow:hidden}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;justify-content:flex-end}.drawer{width:min(560px,100%);height:100%;overflow:auto;background:var(--side);border-left:1px solid var(--line);padding:18px}
.modal{margin:auto;width:min(520px,94%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.scrim.center{justify-content:center;align-items:center}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:block;font-size:12px;color:var(--muted)}.form .full{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;margin-top:4px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2)}.form input[type=checkbox]{width:auto;margin:0 8px 0 0}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:380px;margin-top:8px}.toast.bad{border-color:var(--red)}.toast.good{border-color:var(--green)}
.bracket{display:flex;gap:18px;overflow:auto;padding:6px 2px}.bcol{min-width:160px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}.bm{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}.bm div{padding:6px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.bm div+div{border-top:1px solid var(--line)}.bm .w{color:var(--green);font-weight:700}.bm .l{color:var(--muted);text-decoration:line-through}
.menu{display:none;margin:12px 12px 0;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);width:calc(100% - 24px)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.menu{display:block}main{padding:12px}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="login" id="loginView">
  <div class="box">
    <h1>🎲 CodePlay Admin</h1><div class="mut">Sign in to the control panel</div>
    <label class="sm mut" style="display:block;margin-top:16px" for="pw">Admin password</label>
    <input class="f" id="pw" type="password" autocomplete="current-password" autofocus>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" id="loginBtn">Sign in</button>
  </div>
</div>

<div class="app hide" id="appView">
  <aside class="side">
    <div class="brand">🎲 CodePlay Admin<small id="envTag"></small></div>
    <nav class="nav" id="nav"></nav>
    <div style="margin-top:14px;padding:0 10px"><a class="sm" href="admin-classic.html">Classic rules editor</a><br><button class="btn sm" style="margin-top:10px;width:100%" id="logoutBtn">Sign out</button></div>
  </aside>
  <div style="min-width:0">
    <select class="menu" id="menu" aria-label="Section"></select>
    <main id="main"></main>
  </div>
</div>
<div id="toastBox"></div>

<script>
(function(){
'use strict';
var KEY='cp_admin_token',token=sessionStorage.getItem(KEY),section='dashboard',timer=null;
var SECTIONS=[['dashboard','📊','Dashboard'],['live','🟢','Live'],['players','👥','Players'],['matches','⚔️','Matches'],['money','💰','Money'],['tournaments','🏆','Tournaments'],['settings','⚙️','Settings'],['system','🖥️','System & logs']];
function $(i){return document.getElementById(i)}
function h(tag,props,kids){var n=document.createElement(tag);props=props||{};Object.keys(props).forEach(function(k){var v=props[k];if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);else if(k==='value')n.value=v;else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v)});(kids||[]).forEach(function(c){if(c!=null&&c!==false)n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)});return n}
function fmt(n){return n==null?'—':Number(n).toLocaleString('en-US')}
function usd(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function when(t){if(!t)return '—';return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function ago(t){if(!t)return '—';var s=Math.floor((Date.now()-new Date(t))/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function dur(s){var d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+(hh?hh+'h ':'')+m+'m'}
function toast(t,cls){var n=h('div',{class:'toast '+(cls||''),role:'status',text:t});$('toastBox').appendChild(n);setTimeout(function(){n.remove()},4200)}
function api(path,opts){opts=opts||{};return fetch('/api/admin'+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){if(r.status===401){signOut(true);throw new Error('auth')}return r.json().catch(function(){return {}}).then(function(d){if(!r.ok){var e=new Error((d.errors&&d.errors.join('; '))||d.error||'error');e.data=d;throw e}return d})})}
function fail(e){if(e.message!=='auth')toast(String(e.message).replace(/-/g,' '),'bad')}
function pill(t,cls){return h('span',{class:'pill '+(cls||''),text:t})}
function statusPill(s){var m={completed:'good','completed-manual':'good',settled:'good',registration:'blue',running:'warn',active:'warn',pending:'warn',cancelled:'bad',rejected:'bad',failed:'bad',expired:'bad','partially_paid':'bad','amount-mismatch':'bad'};return pill(String(s).replace(/_/g,' '),m[s])}
function table(cols,rows,empty){
  if(!rows.length)return h('div',{class:'mut',style:'padding:18px;text-align:center',text:empty||'Nothing to show yet.'});
  return h('div',{class:'scroll'},[h('table',{class:'tbl'},[h('thead',{},[h('tr',{},cols.map(function(c){return h('th',{class:c.r?'r':'',text:c.h})}))]),h('tbody',{},rows.map(function(r){return h('tr',{},cols.map(function(c){var v=c.v(r);return h('td',{class:c.r?'r':''},[v==null?'—':v])}))}))])]);
}
function kpi(v,l,s,go){var c=h('div',{class:'card kpi',style:go?'cursor:pointer':''},[h('div',{class:'v',text:v}),h('div',{class:'l',text:l}),s?h('div',{class:'s',text:s}):null]);if(go)c.addEventListener('click',function(){nav(go)});return c}

/* ---------- auth ---------- */
function signOut(expired){if(token){fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(function(){})}token=null;sessionStorage.removeItem(KEY);clearInterval(timer);$('appView').classList.add('hide');$('loginView').classList.remove('hide');$('pw').value='';if(expired===true)$('loginErr').textContent='Session ended — sign in again.'}
function doLogin(){
  $('loginErr').textContent='';$('loginBtn').disabled=true;
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})}).then(function(r){
    if(!r.ok){$('loginErr').textContent=r.d.error==='too-many-attempts'?'Too many attempts. Wait 10 minutes.':'Wrong password.';return}
    token=r.d.token;sessionStorage.setItem(KEY,token);boot();
  }).catch(function(){$('loginErr').textContent='Could not reach the server.'}).finally(function(){$('loginBtn').disabled=false});
}
$('loginBtn').addEventListener('click',doLogin);$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});$('logoutBtn').addEventListener('click',function(){signOut()});

/* ---------- navigation ---------- */
function buildNav(){
  var nv=$('nav');nv.replaceChildren();SECTIONS.forEach(function(s){nv.appendChild(h('button',{'data-s':s[0],onclick:function(){nav(s[0])}},[s[1]+' ',s[2],h('span',{class:'cnt hide','data-c':s[0]})]))});
  var mn=$('menu');mn.replaceChildren();SECTIONS.forEach(function(s){mn.appendChild(h('option',{value:s[0],text:s[1]+' '+s[2]}))});
  mn.onchange=function(){nav(mn.value)};
}
function nav(s){section=s;location.hash=s;document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===s)});$('menu').value=s;render()}
function boot(){$('loginView').classList.add('hide');$('appView').classList.remove('hide');buildNav();var s=(location.hash||'').slice(1);nav(SECTIONS.some(function(x){return x[0]===s})?s:'dashboard');clearInterval(timer);timer=setInterval(function(){if(document.hidden)return;if(section==='dashboard'||section==='live')render(true)},10000)}
function render(silent){
  var main=$('main'),fn=VIEWS[section];if(!fn)return;
  if(!silent)main.replaceChildren(h('div',{class:'mut',text:'Loading…'}));
  Promise.resolve(fn()).then(function(node){if(VIEWS[section]===fn){main.replaceChildren(node)}}).catch(fail);
}
function header(title,actions){return h('div',{class:'bar'},[h('h2',{text:title})].concat(actions||[]))}
function refreshBtn(){return h('button',{class:'btn sm',onclick:function(){render()},text:'↻ Refresh'})}

/* ---------- dashboard ---------- */
var VIEWS={};
VIEWS.dashboard=function(){return Promise.all([api('/overview'),api('/finance?days=14')]).then(function(r){
  var o=r[0],f=r[1],p=o.players,m=o.money,v=o.versus;
  var root=h('div',{},[header('Dashboard',[h('span',{class:'mut sm',text:'Auto-refreshes every 10s'}),refreshBtn()])]);
  if(o.alerts.length){var box=h('div',{style:'margin-bottom:14px'});o.alerts.forEach(function(a){box.appendChild(h('div',{class:'alert '+a.level,onclick:function(){nav(a.go)}},[h('span',{text:a.level==='bad'?'🔴':'🟠'}),h('span',{text:a.text})]))});root.appendChild(box)}
  var nf=document.querySelector('[data-c="money"]');if(nf){nf.textContent=m.flagged;nf.classList.toggle('hide',!m.flagged)}
  root.appendChild(h('div',{class:'grid g4'},[
    kpi(fmt(p.online),'Players online now',fmt(p.playing)+' in a game · '+fmt(p.sockets)+' connections','live'),
    kpi(fmt(p.total),'Registered players','+'+fmt(p.today)+' today · +'+fmt(p.week)+' this week','players'),
    kpi(fmt(m.chipsInCirculation),'Chips in circulation',usd(m.chipsUsd)+' across '+fmt(m.wallets)+' wallets','money'),
    kpi(fmt(m.houseChips),'House balance (chips)',usd(m.houseUsd)+' collected in fees','money'),
    kpi(usd(m.depositsToday),'Deposits today',usd(m.deposits7d)+' in 7 days · '+usd(m.depositsTotal)+' all time','money'),
    kpi(fmt(v.day.settled),'Versus matches (24h)',fmt(v.day.volume)+' chips staked · '+fmt(v.day.fees)+' fees','matches'),
    kpi(fmt(v.open),'Open matches',v.queues.length?v.queues.map(function(q){return q.key+' ×'+q.waiting}).join(', ')+' waiting':'Nobody in a queue','live'),
    kpi(fmt((o.tournaments.counts.registration||0)+(o.tournaments.counts.running||0)),'Active tournaments',(o.tournaments.counts.running||0)+' running · '+(o.tournaments.counts.registration||0)+' open','tournaments')
  ]));
  var days={};f.byDay.forEach(function(x){var d=days[x.day]=days[x.day]||{dep:0,fee:0,prize:0};if(x.type==='deposit')d.dep+=x.sum;if(x.type==='house_fee'||x.type==='tournament_fee')d.fee+=x.sum;if(x.type==='tournament_prize'||x.type==='win_payout')d.prize+=x.sum});
  var keys=Object.keys(days).sort(),max=Math.max.apply(null,[1].concat(keys.map(function(k){return Math.max(days[k].dep,days[k].fee,days[k].prize)})));
  var chart=h('div',{class:'chart'},keys.map(function(k){var d=days[k];function bar(val,c){return h('i',{style:'height:'+Math.max(1,Math.round(val/max*100))+'px;background:'+c,title:fmt(val)+' chips'})}return h('div',{class:'col'},[h('div',{class:'bargrp'},[bar(d.dep,'var(--green)'),bar(d.prize,'var(--blue)'),bar(d.fee,'var(--gold)')]),h('div',{class:'d',text:k.slice(5)})])}));
  root.appendChild(h('div',{class:'grid g2',style:'margin-top:12px'},[
    h('div',{class:'card'},[h('h3',{text:'Chips per day (last 14 days)'}),keys.length?chart:h('div',{class:'mut',text:'No chip activity yet.'}),h('div',{class:'legend'},[h('span',{},[h('b',{style:'background:var(--green)'}),'Deposited']),h('span',{},[h('b',{style:'background:var(--blue)'}),'Paid out to winners']),h('span',{},[h('b',{style:'background:var(--gold)'}),'House fees'])])]),
    h('div',{class:'card'},[h('h3',{text:'Live rooms'}),table([{h:'Game',v:function(x){return x[0]}},{h:'Rooms',v:function(x){return x[1]},r:1},{h:'Playing',v:function(x){return x[2]},r:1},{h:'Waiting',v:function(x){return x[3]},r:1}],['ludo','whot','chess','snooker'].map(function(g){var x=o.rooms[g];return [g[0].toUpperCase()+g.slice(1),x.rooms,x.playing,x.waiting]})),
      h('h3',{style:'margin-top:16px',text:'Upcoming tournaments'}),table([{h:'Name',v:function(t){return t.name}},{h:'Game',v:function(t){return t.game}},{h:'Starts',v:function(t){return when(t.startAt)}},{h:'Players',v:function(t){return t.players+'/'+t.max},r:1}],o.tournaments.upcoming,'No open tournaments. Create one in Tournaments.')])
  ]));
  return root;
})};

/* ---------- live ---------- */
VIEWS.live=function(){return api('/rooms').then(function(d){
  var root=h('div',{},[header('Live rooms',[h('span',{class:'mut sm',text:'Auto-refreshes every 10s'}),refreshBtn()])]);
  root.appendChild(h('div',{class:'card',style:'margin-bottom:12px'},[h('h3',{text:'Versus queues'}),d.queues.length?h('div',{},d.queues.map(function(q){return pill(q.key.replace(':',' · ')+' chips — '+q.waiting+' waiting','warn')})):h('div',{class:'mut',text:'Nobody is waiting for an opponent.'})]));
  root.appendChild(h('div',{class:'card'},[h('h3',{text:d.rooms.length+' room(s)'}),table([
    {h:'Game',v:function(r){return r.game}},{h:'Code',v:function(r){return h('span',{class:'mono',text:r.code})}},
    {h:'Type',v:function(r){return pill(r.kind,r.kind==='versus'?'warn':r.kind==='tournament'?'blue':'')}},{h:'Stake',v:function(r){return r.stake?fmt(r.stake):'—'},r:1},
    {h:'Players',v:function(r){return h('span',{},r.players.map(function(p,i){return h('span',{},[i?' vs ':'',h('span',{class:'dot '+(p.connected?'online':'')}),p.name+(p.bot?' 🤖':'')])}))}},
    {h:'State',v:function(r){return r.over?pill('finished'):r.started?pill('playing','warn'):pill('waiting')}},{h:'Age',v:function(r){return dur(r.ageSec)},r:1}],d.rooms,'No rooms right now.')]));
  return root})};

/* ---------- players ---------- */
var playerQ='',playerPage=0;
VIEWS.players=function(){return api('/players?q='+encodeURIComponent(playerQ)+'&page='+playerPage).then(function(d){
  var search=h('input',{class:'f',style:'width:260px;margin:0',placeholder:'Search username, email or id',value:playerQ});
  var go=function(){playerQ=search.value.trim();playerPage=0;render()};search.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  var root=h('div',{},[header('Players',[search,h('button',{class:'btn',onclick:go,text:'Search'})])]);
  root.appendChild(h('div',{class:'card'},[h('div',{class:'mut sm',style:'margin-bottom:8px',text:fmt(d.total)+' player(s)'}),table([
    {h:'Player',v:function(p){return h('span',{},[h('span',{class:'dot '+(p.online==='offline'?'':p.online)}),p.username||'(no username yet)',p.banned?' ':null,p.banned?pill('banned','bad'):null])}},{h:'Email',v:function(p){return p.email}},
    {h:'Chips',v:function(p){return fmt(p.balance)},r:1},{h:'Points',v:function(p){return fmt(p.points)},r:1},{h:'W/L',v:function(p){return p.wins+'/'+p.losses},r:1},{h:'Joined',v:function(p){return ago(p.createdAt)}},
    {h:'',v:function(p){return h('button',{class:'btn sm',onclick:function(){playerDrawer(p.id)},text:'Open'})}}],d.rows,'No players match.'),

    if(val&&typeof val==='object'&&!Array.isArray(val)){box.appendChild(h('div',{class:'full sm mut',style:'margin-top:6px',text:labelOf(k)}));build(path,val,box);return}
    var inp;if(typeof val==='boolean'){inp=h('input',{type:'checkbox'});inp.checked=val;box.appendChild(h('label',{},[inp,labelOf(k)]))}
    else if(Array.isArray(val)){inp=h('input',{value:val.join(', ')});box.appendChild(h('label',{},[labelOf(k)+' (comma separated)',inp]))}
    else if(typeof val==='number'){inp=h('input',{type:'number',value:String(val)});box.appendChild(h('label',{},[labelOf(k),inp]))}
    else{var long=String(val).length>40||/Message|Header/.test(k);inp=h(long?'textarea':'input',{value:val,rows:long?'3':null});box.appendChild(h('label',{class:long?'full':''},[labelOf(k),inp]))}
    inputs[path]={el:inp,orig:val}})}
  var box=h('div',{class:'form'});build('',obj,box);
  function collect(){var out={};Object.keys(inputs).forEach(function(path){var i=inputs[path],val;if(typeof i.orig==='boolean')val=i.el.checked;else if(Array.isArray(i.orig)){var parts=i.el.value.split(/[ ,]+/).filter(Boolean);val=typeof i.orig[0]==='number'||!i.orig.length?parts.map(Number):parts}else if(typeof i.orig==='number')val=Number(i.el.value);else val=i.el.value;
    var keys=path.split('.'),o=out;keys.forEach(function(k,ix){if(ix===keys.length-1)o[k]=val;else o=o[k]=o[k]||{}})});return out}
  return h('div',{class:'card',style:'margin-bottom:12px'},[h('h3',{text:labelOf(sec)+' settings'}),box,h('div',{class:'tools',style:'margin-top:12px'},[h('button',{class:'btn pri',onclick:function(){api('/config/'+sec,{method:'PATCH',body:collect()}).then(function(){toast('Saved '+labelOf(sec),'good')}).catch(fail)},text:'Save'}),h('button',{class:'btn',onclick:function(){if(confirm('Reset '+labelOf(sec)+' to defaults?'))api('/config/'+sec+'/reset',{method:'POST',body:{}}).then(function(){toast('Reset','good');render()}).catch(fail)},text:'Reset to defaults'})])]);
}

    ['Admin password',F.adminPasswordSet,F.adminPasswordSet?'Set':'Using the default password!'],['Test chips off',!F.testChips,F.testChips?'ON — anyone signed in can add free chips. Turn off before going live.':'Off'],['WhatsApp (Meta Cloud API)',F.whatsappMeta,F.whatsappMeta?'Verify token set':'Not configured'],['Public URL',!!F.publicBaseUrl,F.publicBaseUrl||'PUBLIC_BASE_URL / SITE_URL not set (needed for deposit callbacks)']];
  return h('div',{},[header('System & logs',[refreshBtn()]),
    h('div',{class:'grid g4',style:'margin-bottom:12px'},[kpi(dur(s.uptimeSec),'Uptime'),kpi(s.memoryMb+' MB','Memory (RSS)',s.heapMb+' MB heap'),kpi(s.node,'Node'),kpi(s.env,'Environment')]),
    h('div',{class:'card',style:'margin-bottom:12px'},[h('h3',{text:'Configuration health'}),table([{h:'',v:function(x){return pill(x[1]?'OK':'Check',x[1]?'good':'bad')}},{h:'Item',v:function(x){return x[0]}},{h:'Status',v:function(x){return x[2]}}],rows)]),
    h('div',{class:'card'},[h('h3',{text:'Admin activity log'}),table([{h:'When',v:function(l){return when(l.at)}},{h:'Action',v:function(l){return l.action}},{h:'Target',v:function(l){return l.target?h('span',{class:'mono',text:String(l.target).slice(0,12)}):null}},{h:'Details',v:function(l){return JSON.stringify(l.details||{}).slice(0,140)}}],logs,'No admin actions yet.')])])})};
