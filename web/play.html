<script>var PATH=LudoBoard.PATH,START_INDEX=LudoBoard.START_INDEX,HOME_COLS=LudoBoard.HOME_COLS,HOME_BASE_POS=LudoBoard.HOME_BASE_POS,COLORHEX=LudoBoard.COLORHEX,SAFE_CELLS=LudoBoard.SAFE_CELLS,pathIdx=LudoBoard.pathIdx,globalCell=LudoBoard.globalCell;

  var panelEl=document.getElementById('playersPanel');

function updateTimerUi(){

    var c=cards[i],on=timerInfo&&!gameOver&&Number(c.dataset.p)===timerInfo.turn,bar=c.querySelector('.pbar i'),cnt=c.querySelector('.pcount');
    if(!on){bar.style.transform='scaleX(0)';c.classList.remove('urgent');cnt.textContent='';continue}

setInterval(updateTimerUi,250);
function render(){
  if(!viewerSet&&players.length&&HUMAN_INDEX>=0&&players[HUMAN_INDEX]){board.setViewer(players[HUMAN_INDEX].colors[0]);viewerSet=true}
  var items=[];
  players.forEach(function(p,pIdx){p.colors.forEach(function(color){p.tokens[color].forEach(function(pos,idx){
    var key=color+':'+idx,done=pos===56,rc=pos===-1?HOME_BASE_POS[color][idx]:(done?[7,7]:globalCell(color,pos));
    var valid=pIdx===HUMAN_INDEX&&turn===HUMAN_INDEX&&isCurrentlyValid(color,idx);

  })})});

function setSub(){var el=document.getElementById('roomSub');if(!el)return;el.textContent=(GAME_MODE==='friends'||SPECTATOR_MODE?(SPECTATOR_MODE?'Watching · ':'Room ')+(ROOM_CODE||''):'vs Computer · '+players.length+' players')}

  if(window._resyncing)return;var now=Date.now();if(now-lastCue<1500)return;lastCue=now;
  var b=document.getElementById('turnBanner');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');

}
document.addEventListener('visibilitychange',function(){if(!document.hidden)document.title='CodePlay Ludo'});
function confetti(){var w=document.createElement('div');w.className='confetti';var bits=['🎉','✨','🏆','🎲','⭐'];for(var i=0;i<26;i++){var s=document.createElement('span');s.textContent=bits[i%bits.length];s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(2.2+Math.random()*1.8)+'s';s.style.animationDelay=(Math.random()*.6)+'s';w.appendChild(s)}document.body.appendChild(w);setTimeout(function(){w.remove()},4800)}
var pendingAfter=null,pendingValue=null;
function onTokenTap(color,idx){if(SPECTATOR_MODE||!isCurrentlyValid(color,idx))return;if(GAME_MODE!=='friends'){var value=pendingValue,after=pendingAfter;currentValid=[];applyMove(turn,{color:color,idx:idx},value);render();if(gameOver){rollBtn.disabled=true;return}after();return}if(!window._netPending)return;var net=window._netPending;window._netPending=null;currentValid=[];window._netAfterMove=net.isLast?null:net.after;socket.emit('play-move',{code:ROOM_CODE,move:{color:color,idx:idx},value:net.value,mode:net.mode,isLastMoveThisTurn:net.isLast})}
// Capture behavior is controlled by the server's public rule configuration; the URL cannot override it.
function applyMove(pIdx,mv,value){var p=players[pIdx],arr=p.tokens[mv.color],oldPos=arr[mv.idx],newPos=oldPos===-1?0:oldPos+value;if(newPos>56&&!RULES.exactRollToFinish)newPos=56;arr[mv.idx]=newPos;var captured=[];if(newPos<=50&&!(RULES.safeZonesEnabled&&SAFE_CELLS.has(pathIdx(newPos,mv.color)))){var g=pathIdx(newPos,mv.color),capturedOne=false;for(var oi=0;oi<players.length&&!capturedOne;oi++){if(oi===pIdx)continue;var opp=players[oi];for(var oci=0;oci<opp.colors.length&&!capturedOne;oci++){var oc=opp.colors[oci];for(var ti=0;ti<opp.tokens[oc].length;ti++){var t=opp.tokens[oc][ti];if(t>=0&&t<=50&&pathIdx(t,oc)===g){opp.tokens[oc][ti]=-1;captured.push({player:oi,color:oc,idx:ti});log(cap(p.name)+' captured '+cap(oc)+'!');flashCapture(cap(oc)+' sent home!');capturedOne=true;break}}}}if(captured.length&&RULES.captureSendsCapturerHome){arr[mv.idx]=56;newPos=56;log(cap(p.name)+'’s '+mv.color+' token was removed after the capture!');flashCapture(''+cap(mv.color)+' REMOVED!');}if(captured.length&&RULES.captureGrantsExtraTurn)captureBonusPending=true}if(captured.length){if(pIdx===HUMAN_INDEX)CodePlayAudio.play('ludo-capture-attacker');else if(captured.some(function(x){return x.player===HUMAN_INDEX}))CodePlayAudio.play('ludo-capture-victim');}else if(newPos===56){CodePlayAudio.play('ludo-piece-home')}if(captured.length&&RULES.captureSendsCapturerHome)CodePlayAudio.play('ludo-capture-finished');if(newPos===56&&!captured.length)log(cap(p.name)+'’s '+mv.color+' token reached home! ');checkWinner(pIdx);render()}

  var mine=turn===HUMAN_INDEX,busy=modeRow.children.length||document.querySelector('.tok.movable')||(mine&&!rollBtn.disabled);
  if(!busy)socket.emit('request-sync',{code:ROOM_CODE});
},5000);
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(!socket||SPECTATOR_MODE||GAME_MODE!=='friends'||!seatEstablished)return;
  if(!socket.connected){socket.connect();return}
  if(Date.now()-hiddenAt>3000)setTimeout(function(){socket.emit('request-sync',{code:ROOM_CODE})},250);
});

function showModeChoiceNet(splitLegal,combineLegal){modeRow.innerHTML='';wrText('Rolled '+d1+' & '+d2+' — split or combine?');if(splitLegal){var b=document.createElement('button');b.textContent='Split ('+d1+' + '+d2+')';b.onclick=startSplitNet;modeRow.appendChild(b)}if(combineLegal){var c=document.createElement('button');c.textContent='Combine ('+(d1+d2)+')';c.onclick=startCombineNet;modeRow.appendChild(c)}}
function startSplitNet(){modeRow.innerHTML='';promptDieNet(d1,false,function(){promptDieNet(d2,true,null)})}
function promptDieNet(value,isLast,after){var legal=legalMoves(HUMAN_INDEX,value,true);if(!legal.length){log('No legal move for die '+value+' — skipped.');if(isLast)socket.emit('end-turn',{code:ROOM_CODE});else after();return}if(legal.length===1){commitNet(legal[0],value,isLast,after);return}currentValid=legal;wrText('Tap a token to move it by '+value+'.');window._netPending={value:value,isLast:isLast,after:after,mode:'split'};render()}
function commitNet(mv,value,isLast,after){currentValid=[];modeRow.innerHTML='';render();window._netAfterMove=isLast?null:after;socket.emit('play-move',{code:ROOM_CODE,move:mv,value:value,mode:isLast&&value===d1+d2?'combine':'split',isLastMoveThisTurn:isLast})}
function startCombineNet(){modeRow.innerHTML='';var sum=d1+d2,legal=legalMoves(HUMAN_INDEX,sum,false);if(legal.length===1){commitNet(legal[0],sum,true,null);return}currentValid=legal;wrText('Tap a token to move it by '+sum+'.');window._netPending={value:sum,isLast:true,after:null,mode:'combine'};render()}
function initFriendsMode(action,existingCode,playerCount){
 GAME_MODE='friends';SPECTATOR_MODE=(new URLSearchParams(location.search).get('action')==='spectate'||new URLSearchParams(location.search).get('mode')==='watch');ROOM_CODE=normalizeRoomCode(existingCode)||ROOM_CODE;WATCH_TOKEN=(new URLSearchParams(location.search).get('watchToken')||new URLSearchParams(location.search).get('watch')||'').trim();refreshAudienceUi();renderSocialBar();socket=io(window.CODEPLAY_SOCKET_URL||SOCKET_URL||'https://codeplay-ludo-production.up.railway.app',{transports:['websocket','polling'],timeout:12000,reconnection:true,reconnectionAttempts:10});
 var saved=loadActiveRoom(), savedCode=normalizeRoomCode(saved&&saved.code), requestedCode=normalizeRoomCode(existingCode), incomingPlayerToken=(new URLSearchParams(location.search).get('playerToken')||'').trim(), crossTabSaved=(!savedCode||savedCode!==requestedCode)?loadSavedRoomForCode(requestedCode):null;
 var sameTabRoom=!incomingPlayerToken&&!!(saved&&saved.playerToken&&saved.tabId===ROOM_TAB_ID&&savedCode);
 var resumeAcrossTabs=!incomingPlayerToken&&!!(!sameTabRoom&&requestedCode&&crossTabSaved&&crossTabSaved.playerToken);
 if(SPECTATOR_MODE){ROOM_CODE=requestedCode;seatEstablished=false;playerToken=null;}else if(incomingPlayerToken&&requestedCode){ROOM_CODE=requestedCode;playerToken=incomingPlayerToken;seatEstablished=true;}
 else if(sameTabRoom){ROOM_CODE=savedCode;playerToken=saved.playerToken;seatEstablished=true;if(saved.playerCount)playerCount=saved.playerCount;}
 else if(resumeAcrossTabs){ROOM_CODE=requestedCode;playerToken=crossTabSaved.playerToken;if(crossTabSaved.playerCount)playerCount=crossTabSaved.playerCount;}
 socket.on('connect_error',function(err){
   if(seatEstablished&&ROOM_CODE&&playerToken){wrText('Connection lost — reconnecting to your Ludo room…');return;}
   showWaitingRoom('<p>Could not reach the game server.</p><p class="legend">'+((err&&err.message)||'Connection failed')+'</p><button onclick="location.reload()">Retry</button>');
 });
 socket.on('reconnect_attempt',function(){if(seatEstablished&&ROOM_CODE)wrText('Reconnecting to your Ludo room…');else wrText('Reconnecting to the game server…')});
 socket.on('reconnect_failed',function(){showWaitingRoom(seatEstablished?'<p>Could not reconnect to your Ludo room.</p><p class="legend">Your game seat was kept briefly. Tap Retry to reconnect.</p><button onclick="location.reload()">Retry</button>':'<p>Could not reach the game server.</p><button onclick="location.reload()">Retry</button>')});
 socket.on('error-msg',function(msg){log('Server: '+msg);if(/already rolled/i.test(String(msg))){socket.emit('request-sync',{code:ROOM_CODE});return}if(SOFT[msg]){toast(SOFT[msg]);return}if(SPECTATOR_MODE&&FRIENDLY[msg]){showBlocked.apply(null,FRIENDLY[msg]);return}if(msg==='player-count-disabled'){showWaitingRoom('<p>This player-count mode is disabled by the admin.</p><button onclick="history.back()">Back</button>');return}if(msg==='room-not-found'||msg==='invalid-reconnect-token'){seatEstablished=false;playerToken=null;clearActiveRoom();showWaitingRoom('<p>Your room session is no longer active — create or join again.</p><button onclick="history.back()">Back</button>');return}if(msg==='room-full'&&!seatEstablished){showWaitingRoom('<p>That room is already full.</p><button onclick="history.back()">Back</button>')}});
 socket.on('you-are-player',function(x){
   HUMAN_INDEX=x.index;seatEstablished=true;
   if(x.playerToken){playerToken=x.playerToken;saveActiveRoom();}
   if(ROOM_CODE&&new URLSearchParams(location.search).get('action')!=='reconnect'){
     history.replaceState({},'',location.pathname+'?mode=friends&action=reconnect&code='+ROOM_CODE+(players.length?'&players='+players.length:''));
   }
 });
 socket.on('room-created',function(x){ROOM_CODE=x.code;playerToken=x.playerToken||playerToken;seatEstablished=true;if(x.whatsappBotNumber)WHATSAPP_BOT_NUMBER=String(x.whatsappBotNumber).replace(/\D/g,'');setRoomRoster(x.players);if(x.audience){WATCH_TOKEN=x.audience.spectatorToken||'';setAudience(x.audience)}saveActiveRoom();history.replaceState({},'',location.pathname+'?mode=friends&action=reconnect&code='+ROOM_CODE+'&players='+x.playerCount);renderWaiting(x.joined,x.needed);renderSocialBar();refreshAudienceUi()});
 socket.on('room-status',function(x){ROOM_CODE=normalizeRoomCode(x.code)||ROOM_CODE;if(x.whatsappBotNumber)WHATSAPP_BOT_NUMBER=String(x.whatsappBotNumber).replace(/\D/g,'');setRoomRoster(x.players);if(x.audience)setAudience(x.audience);if(x.started)hideWaitingRoom();else renderWaiting(x.joined,x.needed)});
 socket.on('player-joined',function(x){setRoomRoster(x.players);renderWaiting(x.joined,x.needed)});
 socket.on('player-connection',function(x){setRoomRoster(x.players);log((x.name||'Player')+(x.connected?' reconnected.':' disconnected.'))});
 socket.on('game-audio',function(x){if(x&&x.game==='ludo'&&window.CodePlayAudio)CodePlayAudio.play(x.cue)});
 socket.on('reaction',function(x){showReaction(x.name,x.reaction)});
 socket.on('rematch-status',function(x){rematchStateEl.textContent=x.requested+' / '+x.needed+' players ready for the rematch.'});
 socket.on('game-rematch',function(x){rematchRequested=false;hideGameOver();board.reset();viewerSet=false;lastPos={};panelSig='';applyServerState(x.state);beginNetTurn()});
socket.on('audience-info',function(x){setAudience(x)});
socket.on('audience-host',function(x){if(x&&x.spectatorToken)WATCH_TOKEN=x.spectatorToken;setAudience(x)});
socket.on('chat-message',function(x){addChatMessage(x)});
socket.on('feed',pushFeed);
socket.on('turn-timer',function(x){timerInfo=x.seconds?{turn:x.turn,seconds:x.seconds,deadline:Date.now()+(x.deadline-x.now)}:null;updateTimerUi();if(timerInfo&&x.turn===HUMAN_INDEX&&x.away)toast('You were away — the game is playing for you. Tap to take back control.')});
socket.on('session-replaced',function(){try{socket.io.opts.reconnection=false}catch(e){}showWaitingRoom('<p>This game was opened on another tab or device.</p><p class="legend">Only one screen can play a seat at a time.</p><button onclick="location.reload()">Play here instead</button>')});
socket.on('disconnect',function(reason){if(reason==='io client disconnect'||SPECTATOR_MODE)return;wrText('Connection lost — reconnecting…');rollBtn.disabled=true});
socket.on('spectator-ended',function(x){closeSheets();showBlocked.apply(null,(x&&x.reason==='spectating-disabled')?FRIENDLY['spectating-disabled']:['Link-only now','The host switched this match to link-only. Ask them for the watch link to keep watching.'])});
socket.on('you-are-spectator',function(x){SPECTATOR_MODE=true;GAME_MODE='spectator';HUMAN_INDEX=-1;ROOM_CODE=x.code||ROOM_CODE;if(x.you){myKey=x.you.key}if(x.audience)setAudience(x.audience);setSpectatorUi();wrText('Watching room '+ROOM_CODE+' live.');});
 socket.on('game-ready',function(x){hideWaitingRoom();var busy=x.resync&&(modeRow.children.length||document.querySelector('.tok.movable'));applyServerState(x.state);if(!busy){window._resyncing=!!x.resync;beginNetTurn();window._resyncing=false}});
 socket.on('dice-rolled',function(x){d1=x.dice[0];d2=x.dice[1];animateDice(d1,d2).then(function(){if(!x.options.canSplit&&!x.options.canCombine){log('No legal moves for the current roll.');return}if(x.turn!==HUMAN_INDEX){wrText('The other player rolled '+d1+' & '+d2+'...');return}var splitLegal=legalMoves(HUMAN_INDEX,d1,true).length||legalMoves(HUMAN_INDEX,d2,true).length,combineLegal=legalMoves(HUMAN_INDEX,d1+d2,false).length;showModeChoiceNet(splitLegal,combineLegal)})});
 socket.on('move-applied',function(x){applyServerState(x.state);(x.captured||[]).forEach(function(c){log('Captured '+cap(c.color)+'!');flashCapture(cap(c.color)+' sent home!')});var cb=window._netAfterMove;window._netAfterMove=null;if(cb&&!x.state.gameOver)board.whenIdle().then(cb)});
 socket.on('turn-passed',function(x){window._netAfterMove=null;window._netPending=null;applyServerState(x.state);currentValid=[];modeRow.innerHTML='';board.whenIdle().then(beginNetTurn)});
 socket.on('connect',function(){
   if(SPECTATOR_MODE){showWaitingRoom('<p>Connecting to live match '+ROOM_CODE+'…</p>');socket.emit('spectate-room',{code:ROOM_CODE,watchToken:WATCH_TOKEN,name:PLAYER_NAME,viewerId:VIEWER_ID});return;}
   // A seat that already exists in this browser tab always reconnects.
   // This covers refreshes as well as Socket.IO transport reconnects after a blip.
   if(seatEstablished&&ROOM_CODE&&playerToken){
     showWaitingRoom('<p>Reconnecting to room '+ROOM_CODE+'...</p>');
     socket.emit('reconnect-player',{code:ROOM_CODE,playerToken:playerToken});
     return;
   }
   if(action==='create'){startGame(playerCount);socket.emit('create-room',{playerCount:playerCount,name:PLAYER_NAME,color:PLAYER_COLOR,whatsappToken:WHATSAPP_GAME_TOKEN,visibility:params.get('visibility')||undefined,chatEnabled:params.get('chat')||undefined,turnSeconds:params.get('turn')||undefined});showWaitingRoom('<p>Creating room...</p>')}
   else{ROOM_CODE=requestedCode;socket.emit('join-room',{code:ROOM_CODE,name:PLAYER_NAME,color:PLAYER_COLOR,playerToken:resumeAcrossTabs?playerToken:null,whatsappToken:resumeAcrossTabs?'':WHATSAPP_GAME_TOKEN});showWaitingRoom(resumeAcrossTabs?'<p>Returning to room '+ROOM_CODE+'...</p>':'<p>Joining room '+ROOM_CODE+'...</p>')}
 });
}
const params=new URLSearchParams(location.search);
var PLAYER_NAME=(params.get('name')||'').trim().slice(0,24);
function isGuestName(n){return !n||String(n).trim().toLowerCase()==='guest'}
function savedName(){try{var n=(localStorage.getItem('codeplay_name')||'').trim();if(!isGuestName(n))return n;var gp=JSON.parse(localStorage.getItem('codeplay_guest_profile')||'null');if(gp&&!isGuestName(gp.name))return String(gp.name).trim()}catch(e){}return ''}
function rememberName(n){try{localStorage.setItem('codeplay_name',n);var gp=JSON.parse(localStorage.getItem('codeplay_guest_profile')||'null');if(gp){gp.name=n;localStorage.setItem('codeplay_guest_profile',JSON.stringify(gp))}}catch(e){}}
function ensureName(){
  var m=params.get('mode'),a=params.get('action');
  if(isGuestName(PLAYER_NAME)){var s=savedName();if(s)PLAYER_NAME=s}
  var needs=m==='friends'&&(a==='join'||a==='create')&&isGuestName(PLAYER_NAME);
  if(!isGuestName(PLAYER_NAME)){rememberName(PLAYER_NAME);return Promise.resolve()}
  if(!needs){PLAYER_NAME='Guest';return Promise.resolve()}
  return new Promise(function(resolve){
    var modal=document.getElementById('nameModal'),input=document.getElementById('nameInput');
    document.body.classList.add('waiting');modal.classList.add('show');setTimeout(function(){try{input.focus()}catch(e){}},300);
    function go(){var v=String(input.value||'').trim().slice(0,24);if(!v){input.focus();input.style.borderColor='#ff5a6a';return}PLAYER_NAME=v;rememberName(v);modal.classList.remove('show');resolve()}
    document.getElementById('nameGo').onclick=go;input.addEventListener('keydown',function(ev){if(ev.key==='Enter')go()});
  });
}
const PLAYER_COLOR=params.get('color')||null;
async function loadPublicRules(){
  try{
    const res=await fetch('/api/config/public',{cache:'no-store'});
    const cfg=await res.json();
    if(cfg&&cfg.rules)RULES=Object.assign(RULES,cfg.rules);
    if(cfg&&cfg.socketUrl)SOCKET_URL=cfg.socketUrl;
    if(cfg&&cfg.bot&&cfg.bot.whatsappNumber)WHATSAPP_BOT_NUMBER=String(cfg.bot.whatsappNumber).replace(/\D/g,'');
  }catch(e){}
}
(async function boot(){
  await loadPublicRules();
  await ensureName();
  var requestedPlayers=Number(params.get('players'))||4;
  var allowed=Array.isArray(RULES.playerCounts)&&RULES.playerCounts.length?RULES.playerCounts:[2,3,4];
  var playerCount=allowed.indexOf(requestedPlayers)!==-1?requestedPlayers:allowed[0];
  if(params.get('mode')==='friends'||params.get('mode')==='watch'||params.get('action')==='spectate')initFriendsMode(params.get('action')||'spectate',params.get('code'),playerCount);
  else startGame(playerCount);
})();
</script>
