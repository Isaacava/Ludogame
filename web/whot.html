<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodePlay Whot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="/audio.js"></script>
<style>
:root{--bg:#07130f;--panel:#0d1d18;--panel2:#102720;--ink:#f7faf8;--muted:#8fa59b;--line:rgba(255,255,255,.09);--felt:#0a4d3b;--felt2:#07362b;--gold:#ffd75a;--green:#25d366}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#17372f 0,#07130f 48%);color:var(--ink);overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom,0)}button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}
.page{min-height:100vh;display:flex;justify-content:center}.app{width:min(980px,100%);padding:14px;display:grid;gap:12px}
.bar,.panel{background:rgba(13,29,24,.9);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.23);backdrop-filter:blur(8px)}
.bar{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.sub{font-size:12px;color:var(--muted)}
.iconBtn{background:var(--panel2);padding:10px 12px;border-radius:12px;transition:transform .15s}.iconBtn:active{transform:scale(.92)}
.wait{padding:44px 18px;text-align:center}.wait .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.roomCode{font-size:42px;letter-spacing:8px;font-weight:950;margin:8px 0 18px}
.share{margin-top:12px;width:100%;padding:12px;border-radius:12px;background:#2a7bf6;color:#fff;font-weight:800}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player{padding:10px 12px;background:rgba(13,29,24,.86);border:1px solid var(--line);border-radius:15px;transition:.25s}.player.turn{border-color:rgba(255,215,90,.95);box-shadow:0 0 0 1px rgba(255,215,90,.22),0 0 18px rgba(255,215,90,.18);animation:turnPulse 1.4s ease-in-out infinite}@keyframes turnPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,215,90,.22),0 0 12px rgba(255,215,90,.14)}50%{box-shadow:0 0 0 1px rgba(255,215,90,.44),0 0 22px rgba(255,215,90,.25)}}.player .name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .cards{font-size:12px;color:var(--muted);margin-top:2px}
.table{padding:14px;display:grid;gap:14px;min-height:500px;background:radial-gradient(circle at center,var(--felt) 0,var(--felt2) 64%,#05291f 100%);position:relative;overflow:hidden}.table:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at center,rgba(255,255,255,.022) 0 2px,transparent 2px 11px);opacity:.4;pointer-events:none}
.call{min-height:24px;color:#ffe79a;font-weight:900;text-align:center;position:relative;z-index:2}.call.bump{animation:bump .28s ease-out}@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.pile{display:flex;align-items:center;justify-content:center;gap:18px;position:relative;z-index:2}.deck{width:104px;height:148px;border-radius:16px;background:repeating-linear-gradient(45deg,#153d68 0 8px,#194b82 8px 16px);display:grid;place-items:center;border:3px solid #eef3f8;box-shadow:0 14px 28px rgba(0,0,0,.3);color:#fff;font-weight:900;cursor:pointer;transition:transform .15s,box-shadow .15s}.deck:active{transform:scale(.95)}.deck.canDraw{animation:deckGlow 1.45s ease-in-out infinite}@keyframes deckGlow{0%,100%{box-shadow:0 0 0 2px var(--gold),0 12px 26px rgba(0,0,0,.28)}50%{box-shadow:0 0 0 5px rgba(255,215,90,.22),0 16px 32px rgba(0,0,0,.34)}}.deck.disabled{cursor:default;opacity:.52;animation:none}.deck .label{font-size:11px;letter-spacing:.07em}.deck .count{font-size:24px;margin-top:3px}
.card{width:104px;height:148px;border-radius:16px;background:#fdfdfd;color:#151817;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:3px solid #fff;box-shadow:0 12px 24px rgba(0,0,0,.3);user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .18s,box-shadow .18s,opacity .18s}.card .num{font-size:27px;font-weight:950;line-height:1}.card .shape{font-size:58px;text-align:center;line-height:1}.card .tag{font-size:10px;font-weight:900;text-align:right;text-transform:uppercase;opacity:.58}.card.whot{background:linear-gradient(145deg,#ffe47c,#f39b33)}.card.playable{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 16px 28px rgba(0,0,0,.33);transform:translateY(-8px);animation:cardFloat 1.8s ease-in-out infinite}.card.playable:hover{transform:translateY(-11px) scale(1.025)}.card.playable:active{transform:translateY(-3px) scale(.985)}.card.unplayable{opacity:.48;filter:saturate(.7)}@keyframes cardFloat{0%,100%{translate:0 -7px}50%{translate:0 -11px}}
.status{padding:10px 12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);border-radius:13px;text-align:center;position:relative;z-index:2;min-height:20px}.handPanel{padding:14px}.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;perspective:900px}.hand .card{width:82px;height:116px;padding:8px;animation:dealIn .35s cubic-bezier(.2,.9,.32,1.2) both}@keyframes dealIn{from{transform:translateY(28px) rotate(6deg) scale(.82);opacity:0}to{transform:translateY(0) rotate(0) scale(1);opacity:1}}
.flying{position:fixed;z-index:50;pointer-events:none;will-change:transform,opacity;transition:transform .44s cubic-bezier(.25,.75,.2,1),opacity .44s}
.reactions{display:flex;gap:6px;overflow:auto}.react{padding:8px 10px;border-radius:999px;background:var(--panel2);transition:transform .12s}.react:active{transform:scale(.92)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.modal.show .modalCard{animation:modalIn .22s ease-out}@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}.modalCard{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.modalCard h3{margin:0 0 6px}.shapeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.shapeIcon{padding:14px 8px;border-radius:14px;background:var(--panel2);font-weight:800;transition:transform .15s,background .15s}.shapeIcon:active{transform:scale(.93);background:#17372d}.shapeIcon .glyph{font-size:30px;display:block;margin-bottom:4px}
.result{display:grid;gap:8px;margin-top:12px}.resultRow{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:var(--panel2)}.resultRow.winner{border:1px solid var(--gold)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:39}.confetti span{position:absolute;top:-12px;font-size:18px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.15}}
@media(max-width:620px){.players{grid-template-columns:repeat(2,1fr)}.table{min-height:430px}.pile{gap:10px}.deck,.card{width:84px;height:120px}.card .shape{font-size:46px}.hand .card{width:74px;height:104px}.hand .card .shape{font-size:38px}}
</style>
</head>
<body>
<div class="page"><main class="app">
  <div class="bar"><div><div class="brand">🃏 CodePlay Whot</div><div class="sub" id="roomLabel">Connecting…</div></div><div style="display:flex;gap:6px"><button class="iconBtn" id="soundToggle" aria-label="Toggle game sounds">🔊</button><button class="iconBtn" id="homeBtn">⌂</button></div></div>
  <section id="waiting" class="panel wait"><div class="spinner"></div><div class="sub">CodePlay Whot</div><div class="roomCode" id="roomCode" style="display:none">----</div><div id="waitingText">Connecting to the game…</div><button class="share" id="inviteBtn" style="display:none">💬 Invite on WhatsApp</button></section>
  <section id="game" style="display:none">
  <div class="players" id="players"></div>
  <div class="panel table">
    <div class="call" id="callLabel">Match by shape or number</div>
    <div class="pile"><div class="deck" id="market" aria-label="Draw from market"><div><div class="label">MARKET</div><div class="count" id="marketCount">0</div></div></div><div id="topSlot"></div></div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="panel handPanel"><div class="sub" style="margin-bottom:8px">Your cards · tap a highlighted card to play</div><div class="hand" id="hand"></div></div>
  <div class="reactions" id="reactions"></div>
</section>
</main></div>
<div class="modal" id="whotModal"><div class="modalCard"><h3 id="callTitle">Call after WHOT</h3><div class="sub" id="callHelp">Choose what the next player must follow.</div><div class="shapeGrid" id="shapeGrid"></div></div></div><div class="modal" id="gameOver"><div class="modalCard"><h3 id="winnerTitle">🏆 Round over</h3><div id="winnerSub" class="sub"></div><div class="result" id="results"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="action primary" id="rematchBtn">Play Again</button><button class="action" id="shareBtn">Share Result</button></div></div></div>
<script>
(function(){
const params=new URLSearchParams(location.search),API_BASE=window.CODEPLAY_API_BASE||'',SOCKET_DEFAULT='https://codeplay-ludo-production.up.railway.app',profileName=(params.get('name')||'Guest').slice(0,40)||'Guest';
const SHAPE_GLYPHS={circle:'●',triangle:'▲',cross:'✚',square:'■',star:'★',whot:'W'},SHAPE_LABEL={circle:'Circle',triangle:'Triangle',cross:'Cross',square:'Square',star:'Star'},REACTIONS=['😂','🔥','👏','😭','Omo!','Sharp!'];
let socket=null,roomCode=(params.get('code')||'').trim().toUpperCase(),playerToken=null,me=0,state=null,mode=params.get('mode')||'friends',action=params.get('action')||'create',pendingCardId=null;
const e={roomLabel:document.getElementById('roomLabel'),waiting:document.getElementById('waiting'),roomCode:document.getElementById('roomCode'),waitingText:document.getElementById('waitingText'),game:document.getElementById('game'),players:document.getElementById('players'),topSlot:document.getElementById('topSlot'),marketCount:document.getElementById('marketCount'),market:document.getElementById('market'),status:document.getElementById('status'),hand:document.getElementById('hand'),whotModal:document.getElementById('whotModal'),shapeGrid:document.getElementById('shapeGrid'),gameOver:document.getElementById('gameOver'),winnerTitle:document.getElementById('winnerTitle'),winnerSub:document.getElementById('winnerSub'),results:document.getElementById('results'),rematchBtn:document.getElementById('rematchBtn'),shareBtn:document.getElementById('shareBtn'),callLabel:document.getElementById('callLabel'),reactions:document.getElementById('reactions'),homeBtn:document.getElementById('homeBtn'),inviteBtn:document.getElementById('inviteBtn'),callTitle:document.getElementById('callTitle'),callHelp:document.getElementById('callHelp')};
function tabId(){let x=sessionStorage.getItem('codeplay_whot_tab_id');if(!x){x=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random();sessionStorage.setItem('codeplay_whot_tab_id',x)}return x}
function activeKey(){return 'codeplay_active_whot_room:'+tabId()}
function saveRoom(){if(roomCode&&playerToken)localStorage.setItem(activeKey(),JSON.stringify({code:roomCode,playerToken,savedAt:Date.now()}))}
function loadRoom(){try{return JSON.parse(localStorage.getItem(activeKey())||'null')}catch(e){return null}}
function loadSavedRoomForCode(code){const target=String(code||'').trim().toUpperCase(),prefix='codeplay_active_whot_room:';let out=null;for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||key.indexOf(prefix)!==0)continue;try{const item=JSON.parse(localStorage.getItem(key)||'null');if(item&&String(item.code||'').toUpperCase()===target&&item.playerToken&&(!out||Number(item.savedAt||0)>Number(out.savedAt||0)))out=item}catch(e){}}return out}
function cap(v){v=String(v||'');return v.charAt(0).toUpperCase()+v.slice(1)}
function showWaiting(t){e.waiting.style.display='block';e.game.style.display='none';e.waitingText.textContent=t||'Connecting to the game…'}
function showGame(){e.waiting.style.display='none';e.game.style.display='block'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cardHtml(card,playable){const cls='card'+(card.isWhot?' whot':'')+(playable===true?' playable':playable===false?' unplayable':'');return '<div class="'+cls+'" data-card-id="'+esc(card.id)+'"><div class="num">'+card.number+'</div><div class="shape">'+(SHAPE_GLYPHS[card.shape]||'?')+'</div><div class="tag">'+(card.isWhot?'WHOT':cap(card.shape))+'</div></div>'}
function canPlay(card,s){if(!s||s.turn!==me||s.gameOver)return false;if(s.pendingPick)return card.number===s.pendingPick.number||(!card.isWhot?false:!!s.rules.whotCanDefendPick);if(card.isWhot)return true;if(s.whotCall)return s.whotCall.mode==='shape'?card.shape===s.whotCall.value:card.number===s.whotCall.value;return !!s.top&&(card.shape===s.activeShape||card.number===s.top.number)}
function fly(from,to,html){if(!from||!to)return;const ghost=document.createElement('div');ghost.className='flying';ghost.innerHTML=html;ghost.style.left=from.left+'px';ghost.style.top=from.top+'px';ghost.style.width=from.width+'px';ghost.style.height=from.height+'px';document.body.appendChild(ghost);requestAnimationFrame(()=>{ghost.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale('+(to.width/from.width)+') rotate(-6deg)';ghost.style.opacity='.9'});setTimeout(()=>ghost.remove(),500)}
function confetti(){const wrap=document.createElement('div');wrap.className='confetti';document.body.appendChild(wrap);const bits=['🎉','✨','🏆','🎊'];for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=bits[i%bits.length];s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(1.6+Math.random()*1.2)+'s';s.style.fontSize=(14+Math.random()*16)+'px';wrap.appendChild(s)}setTimeout(()=>wrap.remove(),3000)}
function render(extra){if(!state)return;showGame();e.roomLabel.textContent='Room '+roomCode;e.marketCount.textContent=String(state.marketCount||0);e.topSlot.innerHTML=state.top?cardHtml(state.top,null):'';(state.players||[]);e.players.innerHTML='';(state.players||[]).forEach(p=>{const d=document.createElement('div');d.className='player'+(p.index===state.turn?' turn':'');d.innerHTML='<div class="name">'+esc(p.name||'Player')+(p.bot?' 🤖':'')+'</div><div class="cards">'+p.handCount+' card'+(p.handCount===1?'':'s')+(p.index===me?' · You':'')+'</div>';e.players.appendChild(d)});const own=(state.players[me]&&state.players[me].cards)||[];e.hand.innerHTML='';own.forEach((card,index)=>{const playable=canPlay(card,state),wrap=document.createElement('div');wrap.innerHTML=cardHtml(card,playable);const node=wrap.firstElementChild;node.style.animationDelay=(index*.035)+'s';if(playable)node.onclick=()=>onCard(index,card);e.hand.appendChild(node)});let prompt='Match '+cap(state.activeShape||'shape')+' or '+(state.top?state.top.number:'number');if(state.pendingPick)prompt='Pick '+state.pendingPick.amount+' — defend with '+state.pendingPick.number;if(state.whotCall)prompt='Call: '+(state.whotCall.mode==='shape'?cap(state.whotCall.value):state.whotCall.value);if(e.callLabel.textContent!==prompt){e.callLabel.textContent=prompt;e.callLabel.classList.remove('bump');void e.callLabel.offsetWidth;e.callLabel.classList.add('bump')}const isTurn=state.turn===me&&!state.gameOver;const hasPlayable=own.some(c=>canPlay(c,state));const canDraw=isTurn&&((state.rules&&state.rules.allowDrawWithPlayable)||!hasPlayable||!!state.pendingPick);e.market.classList.toggle('canDraw',!!canDraw);e.market.classList.toggle('disabled',!isTurn);e.market.onclick=canDraw?onDraw:null;e.status.textContent=state.gameOver?'Round complete':isTurn?(state.pendingPick?'Tap a '+state.pendingPick.number+' card to defend or tap the market to take the penalty.':'Tap a highlighted card to play it, or tap the market to draw.'):(state.players[state.turn]?state.players[state.turn].name:'Opponent')+' is thinking…';if(extra&&extra.played){const src=document.querySelector('[data-card-id="'+String(extra.played).replace(/"/g,'')+'"]');if(src){const to=e.topSlot.getBoundingClientRect();fly(src.getBoundingClientRect(),to,src.outerHTML)}}if(extra&&extra.drawn&&extra.drawn.length){fly(e.market.getBoundingClientRect(),e.hand.getBoundingClientRect(),'<div class="card" style="background:repeating-linear-gradient(45deg,#153d68 0 8px,#194b82 8px 16px);border:3px solid #fff"></div>')}if(state.gameOver)showGameOver()}
function shouldAnnounceLastCard(){return !(state&&state.rules&&state.rules.enforceLastCardCall&&state.lastCallRequired)||window.confirm('This play leaves you with one card. Announce your LAST CARD now?')}
function onCard(index,card){if(!shouldAnnounceLastCard())return;if(card.isWhot){openWhotCall(index);return}socket.emit('whot:play-card',{code:roomCode,cardId:card.id,lastCall:!!(state.rules&&state.rules.enforceLastCardCall&&state.lastCallRequired)})}
function onDraw(){if(!state||state.turn!==me||state.gameOver)return;socket.emit('whot:draw',{code:roomCode});e.status.textContent='Drawing from the market…'}
function openWhotCall(index){pendingCardId=String(state.players[me].cards[index].id);const mode=(state.rules&&state.rules.whotCallMode)||'shape';e.callTitle.textContent=mode==='number'?'Choose the WHOT number':'Choose the WHOT shape';e.callHelp.textContent=mode==='number'?'Tap the number the next player must follow.':'Tap the shape the next player must follow.';e.shapeGrid.innerHTML='';const items=mode==='number'?[1,2,3,4,5,7,8,10,11,12,13,14]:['circle','triangle','cross','square','star'];items.forEach(value=>{const b=document.createElement('button');b.className='shapeIcon';b.innerHTML=mode==='shape'?'<span class="glyph">'+SHAPE_GLYPHS[value]+'</span>'+SHAPE_LABEL[value]:'<span class="glyph">'+value+'</span>Number '+value;b.onclick=()=>{e.whotModal.classList.remove('show');socket.emit('whot:play-card',{code:roomCode,cardId:pendingCardId,call:value,lastCall:!!(state.rules&&state.rules.enforceLastCardCall&&state.lastCallRequired)});pendingCardId=null};e.shapeGrid.appendChild(b)});e.whotModal.classList.add('show')}
function showGameOver(){const winner=state.winner!=null&&state.players[state.winner]?state.players[state.winner].name:'Winner';e.winnerTitle.textContent='🏆 '+winner+' wins!';e.winnerSub.textContent='Penalty points remaining in each hand';e.results.innerHTML='';(state.players||[]).forEach((p,i)=>{const row=document.createElement('div');row.className='resultRow'+(i===state.winner?' winner':'');row.innerHTML='<span>'+esc(p.name)+'</span><span>'+(state.roundScores?state.roundScores[i]:'—')+' pts</span>';e.results.appendChild(row)})}
async function loadWhotConfig(){try{const r=await fetch((API_BASE||'')+'/api/config/public',{cache:'no-store'});const d=await r.json();if(d.whot&&d.whot.enabled===false){showWaiting('Whot is currently disabled by the admin.');return false}}catch(err){}return true}
function connect(){socket=io(window.CODEPLAY_SOCKET_URL||SOCKET_DEFAULT,{transports:['websocket','polling'],reconnection:true,reconnectionAttempts:10,timeout:12000});const saved=loadRoom(),requestedCode=String(roomCode||'').toUpperCase(),explicitCreate=mode==='computer'||action==='create';if(!explicitCreate&&!roomCode&&saved&&saved.playerToken){roomCode=saved.code;playerToken=saved.playerToken}if(!explicitCreate&&requestedCode){const cross=loadSavedRoomForCode(requestedCode);if(cross&&cross.playerToken){roomCode=requestedCode;playerToken=cross.playerToken}}socket.on('connect',()=>{if(mode==='computer'){socket.emit('whot:create-room',{playerCount:2,name:profileName,mode:'computer'});showWaiting('Starting your computer game…');return}if(action==='create'||(!action&&!roomCode)){const requested=Number(params.get('players'))||2;socket.emit('whot:create-room',{playerCount:requested,name:profileName,mode:'friends'});showWaiting('Creating your Whot room…');return}if(playerToken&&roomCode){socket.emit('whot:reconnect',{code:roomCode,playerToken});showWaiting('Reconnecting to room '+roomCode+'…');return}socket.emit('whot:join-room',{code:roomCode,name:profileName,playerToken:null});showWaiting('Joining room '+roomCode+'…')});socket.on('whot:created',x=>{roomCode=x.code;playerToken=x.playerToken;me=x.index||0;saveRoom();e.roomCode.textContent=roomCode;e.roomCode.style.display='block';e.inviteBtn.style.display='block';if(x.state)setState(x.state,x);else showWaiting((x.joined||1)+' / '+x.needed+' joined — waiting…')});socket.on('whot:joined',x=>{roomCode=x.code;playerToken=x.playerToken||playerToken;me=x.index;saveRoom();e.roomCode.textContent=roomCode;e.roomCode.style.display='block';if(x.state)setState(x.state,x);else showWaiting((x.joined||1)+' / '+x.needed+' joined — waiting…')});socket.on('whot:state',x=>{if(x.index!=null)me=x.index;if(x.playerToken){playerToken=x.playerToken;saveRoom()}setState(x.state,x)});socket.on('whot:status',x=>{if(x.roomCode)roomCode=x.roomCode;if(x.text)showWaiting(x.text)});socket.on('whot:error',x=>{showWaiting(x.message||String(x))});socket.on('game-audio',x=>{if(x&&x.game==='whot'&&window.CodePlayAudio)CodePlayAudio.play(x.cue)});socket.on('whot:reaction',x=>{if(e.status)e.status.textContent=(x.name||'Player')+' '+x.reaction});socket.on('whot:rematch-status',x=>{if(e.status)e.status.textContent=x.requested+' / '+x.needed+' players ready for a rematch.'});socket.on('whot:rematch',x=>{e.gameOver.classList.remove('show');e.rematchBtn.disabled=false;setState(x.state)});socket.on('connect_error',()=>showWaiting('Could not reach the game server. Refresh to reconnect.'))}
function setState(s,extra){state=s;render(extra);if(state&&state.gameOver){e.gameOver.classList.add('show');confetti()}}
e.homeBtn.onclick=()=>location.href='/';e.inviteBtn.onclick=()=>{if(roomCode){const u=location.origin+location.pathname+'?mode=friends&action=join&code='+roomCode;window.open('https://wa.me/?text='+encodeURIComponent('Join my CodePlay Whot game! Code: '+roomCode+' 👉 '+u),'_blank','noopener')}};e.rematchBtn.onclick=()=>{e.rematchBtn.disabled=true;socket.emit('whot:rematch',{code:roomCode})};e.shareBtn.onclick=()=>{const text='I just played CodePlay Whot in room '+roomCode+'!';if(navigator.share)navigator.share({title:'CodePlay Whot',text,url:location.href}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(text+' '+location.href),'_blank','noopener')};REACTIONS.forEach(r=>{const b=document.createElement('button');b.className='react';b.textContent=r;b.onclick=()=>socket.emit('whot:reaction',{code:roomCode,reaction:r});e.reactions.appendChild(b)});loadWhotConfig().then(ok=>{if(ok)connect()});window.__whotInternals={render,canPlay,onCard,onDraw,openWhotCall,setState,get state(){return state}};
})();
</script></body>
</html>
