<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodePlay Ludo</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;line-height:1.5;background:#f5f5f0;color:#222}
main{background:#fff;padding:28px;border-radius:16px;border:1px solid #ddd}
.actions{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:12px 16px;border-radius:10px;border:0;font:inherit;cursor:pointer;background:#222;color:#fff}
.status{margin-top:14px;color:#666}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:13px}
</style></head>
<body><main>
<div class="badge">CodePlay</div>
<h1>🎲 CodePlay Ludo</h1>
<p>Play Ludo with friends from your browser. The game server is already connected for you.</p>
<div class="actions">
<button onclick="openCreate(2)">Create 2-player</button>
<button onclick="openCreate(3)">Create 3-player</button>
<button onclick="openCreate(4)">Create 4-player</button>
<button onclick="join()">Join room</button>
</div>
<div id="status" class="status">Checking game server…</div>
</main>
<script>
const SERVER='https://codeplay-ludo-production.up.railway.app';
async function checkServer(){
  try{
    const r=await fetch(SERVER+'/health',{cache:'no-store'});
    document.getElementById('status').textContent=r.ok?'🟢 Game server online':'🟠 Game server responded unexpectedly';
  }catch{
    document.getElementById('status').textContent='🔴 Game server is currently unreachable';
  }
}
function openCreate(players){location.href='/play.html?mode=friends&action=create&players='+players;}
function join(){
  const code=prompt('Room code');
  if(!code)return;
  location.href='/play.html?mode=friends&action=join&code='+encodeURIComponent(code.trim().toUpperCase());
}
checkServer();
</script></body></html>
