<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodePlay Ludo</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;line-height:1.5;background:#f5f5f0;color:#222}main{background:#fff;padding:24px;border-radius:16px}input,button{padding:12px;border-radius:10px;border:1px solid #bbb;font:inherit}button{cursor:pointer;background:#222;color:#fff}a{color:inherit}</style>
</head><body><main><h1>🎲 CodePlay Ludo</h1><p>Play Ludo with friends or connect your WhatsApp account.</p>
<label>Railway backend URL<br><input id="server" style="width:100%;box-sizing:border-box" placeholder="https://your-app.up.railway.app"></label>
<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="openCreate(2)">Create 2-player</button><button onclick="openCreate(3)">Create 3-player</button><button onclick="openCreate(4)">Create 4-player</button><button onclick="join()">Join room</button></div>
<p style="margin-top:20px;color:#666">The backend URL is saved only in this browser.</p></main>
<script>
const qs=new URLSearchParams(location.search), saved=localStorage.getItem('codeplay_server')||'';
document.getElementById('server').value=saved;
function server(){const v=document.getElementById('server').value.trim().replace(/\/$/,'');if(!v) return '';localStorage.setItem('codeplay_server',v);return v}
function openCreate(players){const s=server();if(!s)return alert('Enter the Railway backend URL first.');location.href='/play.html?mode=friends&action=create&players='+players+'&server='+encodeURIComponent(s)}
function join(){const s=server();if(!s)return alert('Enter the Railway backend URL first.');const code=prompt('Room code');if(!code)return;location.href='/play.html?mode=friends&action=join&code='+encodeURIComponent(code.trim().toUpperCase())+'&server='+encodeURIComponent(s)}
</script></body></html>
