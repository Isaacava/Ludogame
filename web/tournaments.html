<style>
*{box-sizing:border-box}

.wrap{max-width:480px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button{font-family:inherit}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.st.gold b{color:var(--gold)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}

.btn.full{width:100%;min-height:52px;font-size:16px;margin-top:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .big{font-size:42px;margin-bottom:8px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.skel{height:170px;border-radius:var(--r-md);margin-bottom:12px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}.li:last-child{border:0}.li .me{color:var(--gold);font-weight:800}

.cta{background:linear-gradient(180deg,rgba(47,210,122,.18),rgba(47,210,122,.06));border:1px solid rgba(47,210,122,.5);border-radius:16px;padding:14px;margin-top:14px}.cta b{font-size:16px}
.bracket{display:flex;gap:16px;overflow:auto;padding:4px 2px 8px}.bcol{min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}.bh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bm{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}.bm div{padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px}.bm div+div{border-top:1px solid var(--line)}.bm .w{color:var(--green);font-weight:800}.bm .l{color:var(--muted);text-decoration:line-through}.bm .you{color:var(--gold);font-weight:800}

.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html" aria-label="Back">←</a><h1>Tournaments</h1><div class="bal" id="bal"></div></div>

</div>

<script>window.CODEPLAY_WHERE='tournaments';</script>
<script src="social-ui.js"></script>
<script>
(function(){
'use strict';
var S=window.CodePlaySocial,API=window.CODEPLAY_API_BASE||'',TOKEN=null;try{TOKEN=localStorage.getItem('codeplay_acct_token')}catch(e){}
var GAME={ludo:['🎲','Ludo'],whot:['🃏','Whot'],chess:['♟️','Chess'],snooker:['🎱','Snooker']},CPU=100;

function $(i){return document.getElementById(i)}
function h(tag,props,kids){var n=document.createElement(tag);props=props||{};Object.keys(props).forEach(function(k){var v=props[k];if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v)});(kids||[]).forEach(function(c){if(c!=null&&c!==false)n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)});return n}

function af(path,o){o=o||{};var hd={'Content-Type':'application/json'};if(TOKEN)hd.Authorization='Bearer '+TOKEN;return fetch(API+path,{method:o.method||'GET',headers:hd,body:o.body?JSON.stringify(o.body):undefined}).then(function(r){return r.json().catch(function(){return {}}).then(function(d){return {ok:r.ok,status:r.status,data:d}})})}
var ERR={'registration-closed':'Registration for this tournament has closed.','already-joined':'You are already registered.','tournament-full':'This tournament is full.','insufficient-chips':'You do not have enough chips for the entry fee.','age-confirmation-required':'Please confirm you are 18 or older.','username-required':'Choose a username first (home page).','no-session':'Sign in to join tournaments.','not-joined':'You are not registered.','not-found':'Tournament not found.','server-error':'Something went wrong. Try again.'};

/* ---------- list ---------- */
function drawFilters(){var f=$('filters');f.replaceChildren();[['all','All'],['ludo','🎲 Ludo'],['whot','🃏 Whot'],['chess','♟️ Chess'],['snooker','🎱 Snooker']].forEach(function(o){f.appendChild(h('button',{class:'chip','aria-pressed':String(filter===o[0]),onclick:function(){filter=o[0];drawFilters();drawList()},text:o[1]}))})}

  c.appendChild(h('div',{class:'stats'},[h('div',{class:'st'},[h('b',{text:t.entryFee?fmt(t.entryFee):'Free'}),h('span',{text:t.entryFee?'entry (chips)':'entry'})]),h('div',{class:'st gold'},[h('b',{text:fmt(t.pool)}),h('span',{text:'prize pool'})]),h('div',{class:'st'},[h('b',{text:t.playerCount+'/'+t.maxPlayers}),h('span',{text:'players'})])]));
  c.appendChild(h('div',{class:'prog','aria-hidden':'true'},[h('i',{style:'width:'+Math.min(100,Math.round(t.playerCount/t.maxPlayers*100))+'%'})]));
  var timeEl=h('span',{'data-start':t.status==='registration'?t.startAt:'',text:t.status==='registration'?until(t.startAt):t.status==='running'?'In progress':t.status==='completed'?'Finished':'Cancelled'});
  var act=null;
  if(t.status==='registration'){act=joined?h('span',{class:'pill open',text:'✓ You are in'}):h('button',{class:'btn pri',onclick:function(e){e.stopPropagation();joinFlow(t)},text:t.entryFee?'Join · '+fmt(t.entryFee):'Join free'})}

setInterval(function(){document.querySelectorAll('[data-start]').forEach(function(e){var s=Number(e.getAttribute('data-start'));if(s)e.textContent=until(s)});var cd=document.getElementById('cdown');if(cd&&cd.getAttribute('data-t'))cd.textContent=left(Number(cd.getAttribute('data-t')))},1000);

/* ---------- sheets ---------- */

  if(sheetEl&&!keep)closeSheet();
  var scrim=h('div',{class:'scrim',onclick:function(e){if(e.target===scrim)closeSheet()}}),sh=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  sh.appendChild(h('div',{class:'grab'}));build(sh);scrim.appendChild(sh);document.body.appendChild(scrim);sheetEl=scrim;

}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}openId=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
function loadMe(){return TOKEN?fetch(API+'/api/versus/me',{headers:{Authorization:'Bearer '+TOKEN}}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}):Promise.resolve(null)}

/* ---------- join / leave ---------- */
function joinFlow(t){

      sh.appendChild(h('div',{class:'stats'},[h('div',{class:'st'},[h('b',{text:t.entryFee?fmt(t.entryFee):'Free'}),h('span',{text:'entry fee'})]),h('div',{class:'st gold'},[h('b',{text:fmt(t.pool)}),h('span',{text:'prize pool'})]),h('div',{class:'st'},[h('b',{text:fmt(bal)}),h('span',{text:'your chips'})])]));

  sh.appendChild(b);sh.appendChild(h('button',{class:'btn full',onclick:closeSheet,text:'Stay in'}));})}

/* ---------- detail ---------- */
function openDetail(id,quiet){

      h('div',{class:'sub'},['Join within ',h('b',{id:'cdown','data-t':match.timeoutAt,text:left(match.timeoutAt)}),' or your opponent advances.']),

    sh.appendChild(h('div',{class:'podium'},[[2,'🥈'],[1,'🥇'],[3,'🥉']].map(function(pp){var rs=by(pp[0]);return h('div',{class:'pd'},[h('div',{class:'m',text:pp[1]}),h('b',{text:rs.length?rs.map(function(r){return r.username}).join(' & '):'—'}),h('span',{text:rs.length&&rs[0].prize?'+'+fmt(rs[0].prize)+' chips'+(rs.length>1?' each':''):''})])})));
  }
  if(t.status==='cancelled')sh.appendChild(h('p',{class:'note bad',text:'This tournament was cancelled'+(t.cancelReason==='not-enough-players'?' because not enough players joined':'')+'. Entry fees were refunded.'}));

    var names={};t.players.forEach(function(p){names[p.accountId]=p.username});var myAcc=t.meId;
    sh.appendChild(h('div',{class:'lbl',text:'Bracket'}));
    sh.appendChild(h('div',{class:'bracket'},t.rounds.map(function(rd,i){var final=i===t.rounds.length-1&&rd.length===1;return h('div',{class:'bcol'},[h('div',{class:'bh',text:final?'Final':'Round '+(i+1)})].concat(rd.map(function(mm){function row(pid){var cls=mm.winner?(mm.winner===pid?'w':'l'):'';if(pid&&pid===myAcc&&!cls)cls='you';return h('div',{class:cls},[h('span',{text:(pid?(names[pid]||'?'):'bye')+(pid&&pid===myAcc?' (you)':'')}),mm.status==='active'&&pid?h('span',{text:'●',style:'color:var(--yellow)'}):null])}return h('div',{class:'bm'},[row(mm.a),row(mm.b)])})))})));
  }
  // rules + prizes
  sh.appendChild(h('div',{class:'lbl',text:'Prizes'}));
  var labels=['🥇 1st','🥈 2nd','🥉 3rd (shared by the semi-final losers)'];
  sh.appendChild(h('div',{class:'list'},t.prizeSplit.map(function(p,i){return h('div',{class:'li'},[h('span',{text:labels[i]}),h('b',{text:fmt(Math.floor(t.pool*p/100/(i===2?2:1)))+' chips'+(i===2?' each':'')+' ('+p+'%)'})])})));
  sh.appendChild(h('div',{class:'lbl',text:'How it works'}));
  sh.appendChild(h('div',{class:'note'},['Single-elimination knockout. Opponents are drawn at random and every match is a private game just for tournament players. When your match is ready you will get a notification and a Play now button, and you have ',Math.round(t.matchTimeoutSec/60*10)/10+' minutes to show up or your opponent advances. A drawn game is replayed once, then the higher seed advances.'+(t.chess?' Chess clock: '+Math.round(t.chess.base/60*10)/10+' min per side'+(t.chess.inc?' + '+t.chess.inc+'s':'')+'.':'')+(t.status==='registration'?' If fewer than '+t.minPlayers+' players join, it is cancelled and everyone is refunded.':'')]));
  if(t.players.length){sh.appendChild(h('div',{class:'lbl',text:'Players ('+t.players.length+')'}));sh.appendChild(h('div',{class:'list'},t.players.map(function(p){return h('div',{class:'li'},[h('span',{text:p.username}),h('span',{class:'sub',text:p.seed?'seed '+p.seed:''})])})))}
  sh.appendChild(h('button',{class:'btn full',onclick:closeSheet,text:'Close'}));
}
function myStatus(t){
  if(!t.joined||!t.rounds.length)return null;
  var id=t.meId,last=null,lastRound=0;
  t.rounds.forEach(function(rd,i){rd.forEach(function(m){if(m.a===id||m.b===id){last=m;lastRound=i+1}})});
  if(!last)return null;
  if(last.status==='active')return null;
  if(last.status==='pending')return 'You are through. Waiting for the other match to finish.';
  var finalRound=lastRound===t.rounds.length&&t.rounds[t.rounds.length-1].length===1;
  if(last.winner===id)return finalRound?'🏆 You won this tournament!':'✅ You advanced. Waiting for the next round to be drawn.';
  return 'You were knocked out in '+(finalRound?'the final':'round '+lastRound)+'. Thanks for playing!';
}
function refreshBal(){loadMe().then(function(m){me=m;$('bal').replaceChildren();if(m)$('bal').appendChild(h('span',{},['Your chips',h('b',{text:fmt(m.balance)})]))})}

/* ---------- realtime ---------- */
if(S){S.on('update',function(){});S.on('tournament',function(){load()})}
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
setInterval(function(){if(!document.hidden)load()},20000);

/* ---------- boot ---------- */
drawFilters();drawList();refreshBal();
load().then(function(){var id=(location.hash||'').slice(1);if(id)openDetail(id,true)});
})();
</script>
